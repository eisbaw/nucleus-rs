<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Nucleus compiler pipeline</title>
  <desc>Left-to-right pipeline: dual .nuc inputs parse and lower to AlgoIR/SchedIR, link, ACFG + injection passes, then fork into an upper Petri-net soundness gate (boundedness/deadlock/determinism, emerald check) and a lower per-worker EventList to backends to binaries. Cyan tokens flow along the arrows; the gate check pulses emerald.</desc>

  <style>
    .title  { fill:#e2e8f0; font-size:28px; font-weight:700; }
    .sub    { fill:#94a3b8; font-size:15px; }
    .stageT { fill:#e2e8f0; font-size:17px; font-weight:600; }
    .stageS { fill:#94a3b8; font-size:13px; }
    .tag    { fill:#94a3b8; font-size:13px; font-weight:600; letter-spacing:1px; }

    /* panels light up in sequence as the token wave passes */
    .glow { animation: glow 6s ease-in-out infinite; }
    @keyframes glow {
      0%,100% { stroke:#334155; }
      50%     { stroke:#22d3ee; }
    }
    .g0 { animation-delay: 0s; }
    .g1 { animation-delay: .7s; }
    .g2 { animation-delay: 1.4s; }
    .g3 { animation-delay: 2.1s; }
    .g4u{ animation-delay: 2.9s; }
    .g4l{ animation-delay: 2.9s; }
    .g5l{ animation-delay: 3.6s; }
    .g6l{ animation-delay: 4.3s; }

    /* gate emerald pulse */
    .gateRing { animation: gatepulse 2.4s ease-in-out infinite; transform-origin:center; transform-box: fill-box; }
    @keyframes gatepulse {
      0%,100% { opacity:.35; r:30px; }
      50%     { opacity:1;  r:38px; }
    }
    .check { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw 2.4s ease-in-out infinite; }
    @keyframes draw {
      0%,18%  { stroke-dashoffset: 60; }
      45%,100%{ stroke-dashoffset: 0; }
    }
    .forkLbl { fill:#fbbf24; font-size:13px; font-weight:600; }
  </style>

  <defs>
    <!-- arrowheads -->
    <marker id="ahCyan" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
    <marker id="ahMuted" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="ahEm" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#34d399"/>
    </marker>

    <radialGradient id="tok" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#a5f3fc"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tokEm" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#a7f3d0"/>
      <stop offset="60%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>

    <!-- motion paths (invisible) -->
    <path id="p0"  d="M236,250 L290,250"/>                                  <!-- inputs -> parse -->
    <path id="p1"  d="M470,250 L520,250"/>                                  <!-- parse -> link -->
    <path id="p2"  d="M644,250 L694,250"/>                                  <!-- link -> ACFG -->
    <path id="p3u" d="M896,232 C950,232 950,150 1004,150"/>                 <!-- ACFG -> Petri (up) -->
    <path id="p3l" d="M896,268 C950,268 950,360 1004,360"/>                 <!-- ACFG -> EventList (down) -->
  </defs>

  <!-- ===================== TITLE ===================== -->
  <text x="48" y="56" class="title">The Nucleus compiler pipeline</text>
  <text x="48" y="82" class="sub">algorithm &#215; schedule &#8594; verified, per-worker backends</text>

  <!-- ===================== INPUTS (.nuc x2) ===================== -->
  <g>
    <rect class="glow g0" x="48" y="186" width="188" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="64" y="212" class="stageT" fill="#22d3ee">.nuc algorithm</text>
    <text x="64" y="232" class="stageS">what to compute</text>

    <rect class="glow g0" x="48" y="256" width="188" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="64" y="282" class="stageT" fill="#fbbf24">.nuc schedule</text>
    <text x="64" y="302" class="stageS">how to map it</text>
    <text x="48" y="170" class="tag">SOURCE</text>
  </g>

  <!-- arrow inputs -> parse -->
  <path d="M236,222 C265,222 265,250 290,250" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M236,286 C265,286 265,250 288,250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ahMuted)"/>

  <!-- ===================== PARSE + LOWER ===================== -->
  <g>
    <rect class="glow g1" x="290" y="206" width="180" height="88" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="306" y="232" class="stageT">parse + lower</text>
    <text x="306" y="256" class="stageS" fill="#a78bfa">AlgoIR</text>
    <text x="306" y="276" class="stageS" fill="#a78bfa">SchedIR</text>
    <text x="290" y="170" class="tag">FRONT-END</text>
  </g>
  <path d="M470,250 L518,250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ahMuted)"/>

  <!-- ===================== LINK ===================== -->
  <g>
    <rect class="glow g2" x="520" y="218" width="124" height="64" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="540" y="246" class="stageT">link</text>
    <text x="536" y="268" class="stageS">algo &#10005; sched</text>
  </g>
  <path d="M644,250 L692,250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ahMuted)"/>

  <!-- ===================== ACFG + INJECTION ===================== -->
  <g>
    <rect class="glow g3" x="694" y="200" width="202" height="100" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="710" y="226" class="stageT">ACFG</text>
    <text x="710" y="250" class="stageS" fill="#a78bfa">+ injection passes</text>
    <text x="710" y="272" class="stageS">transfer / sync / host-relay</text>
    <text x="710" y="290" class="stageS">tiling &#183; partition</text>
    <text x="694" y="170" class="tag">MIDDLE-END</text>
  </g>

  <!-- ===================== FORK ===================== -->
  <text x="916" y="138" class="forkLbl">verify</text>
  <text x="916" y="392" class="forkLbl">emit</text>
  <path d="M896,232 C950,232 950,150 1002,150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ahMuted)"/>
  <path d="M896,268 C950,268 950,360 1002,360" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ahMuted)"/>

  <!-- ===================== UPPER: PETRI NET ===================== -->
  <g>
    <rect class="glow g4u" x="1004" y="106" width="188" height="92" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="1020" y="132" class="stageT" fill="#a78bfa">Petri net</text>
    <text x="1020" y="154" class="stageS">places &#183; transitions</text>
    <text x="1020" y="174" class="stageS">marking model</text>
    <text x="1004" y="92" class="tag">SOUNDNESS</text>

    <!-- tiny petri glyph -->
    <circle cx="1150" cy="132" r="6" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <rect x="1140" y="156" width="14" height="6" fill="#a78bfa"/>
    <line x1="1150" y1="138" x2="1147" y2="156" stroke="#a78bfa" stroke-width="1.5"/>
  </g>

  <!-- petri -> gate arrow -->
  <path d="M1192,152 C1212,152 1212,206 1150,222" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#ahEm)" opacity="0.8"/>

  <!-- ===================== GATE (emerald check) ===================== -->
  <g transform="translate(1098,250)">
    <circle class="gateRing" cx="0" cy="0" r="34" fill="none" stroke="#34d399" stroke-width="3"/>
    <circle cx="0" cy="0" r="26" fill="#0f1f1a" stroke="#34d399" stroke-width="2"/>
    <path class="check" d="M-12,1 L-3,11 L13,-11" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="58" class="stageT" fill="#34d399" text-anchor="middle">soundness GATE</text>
    <text x="0" y="78" class="stageS" text-anchor="middle">boundedness</text>
    <text x="0" y="96" class="stageS" text-anchor="middle">deadlock-free</text>
    <text x="0" y="114" class="stageS" text-anchor="middle">determinism</text>
  </g>

  <!-- ===================== LOWER: EVENTLIST -> BACKENDS -> BINARIES ===================== -->
  <g>
    <rect class="glow g4l" x="1004" y="328" width="170" height="64" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="1018" y="356" class="stageT" fill="#22d3ee">per-worker</text>
    <text x="1018" y="378" class="stageS">EventList</text>
    <text x="1004" y="314" class="tag">LOWERING</text>
  </g>
  <path d="M1174,360 L1182,360 C1196,360 1196,430 1174,430 L900,430" fill="none" stroke="#64748b" stroke-width="2"/>

  <g>
    <rect class="glow g5l" x="726" y="404" width="174" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="742" y="426" class="stageT">backends</text>
    <text x="742" y="446" class="stageS">pthreads &#183; mp-tcp &#183; no_std</text>
  </g>
  <path d="M726,430 L662,430" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ahMuted)"/>

  <g>
    <rect class="glow g6l" x="488" y="404" width="174" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="504" y="426" class="stageT" fill="#34d399">binaries</text>
    <text x="504" y="446" class="stageS">verified &#183; byte-identical</text>
    <text x="488" y="390" class="tag">OUTPUT</text>
  </g>

  <!-- gate verdict gates the binaries (emerald link from gate down to backends path) -->
  <path d="M1098,326 C1098,470 1010,470 905,455" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ahEm)" opacity="0.7"/>
  <text x="940" y="492" class="stageS" fill="#34d399">verdict gates emit</text>

  <!-- ===================== FLOWING TOKENS ===================== -->
  <!-- p0: inputs -> parse -->
  <circle r="7" fill="url(#tok)">
    <animateMotion dur="6s" begin="0s"   repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#p0"/></animateMotion>
  </circle>
  <!-- p1: parse -> link -->
  <circle r="7" fill="url(#tok)">
    <animateMotion dur="6s" begin="0.7s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion>
  </circle>
  <!-- p2: link -> ACFG -->
  <circle r="7" fill="url(#tok)">
    <animateMotion dur="6s" begin="1.4s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion>
  </circle>
  <!-- p3u: ACFG -> Petri (fork up) -->
  <circle r="7" fill="url(#tok)">
    <animateMotion dur="6s" begin="2.2s" repeatCount="indefinite"><mpath href="#p3u"/></animateMotion>
  </circle>
  <!-- p3l: ACFG -> EventList (fork down) -->
  <circle r="7" fill="url(#tok)">
    <animateMotion dur="6s" begin="2.2s" repeatCount="indefinite"><mpath href="#p3l"/></animateMotion>
  </circle>

  <!-- emerald token: Petri -> Gate -->
  <circle r="6" fill="url(#tokEm)">
    <animateMotion dur="6s" begin="3.0s" repeatCount="indefinite"
      path="M1192,152 C1212,152 1212,206 1150,222"/>
  </circle>

  <!-- lower token: EventList -> backends -> binaries -->
  <circle r="7" fill="url(#tok)">
    <animateMotion dur="6s" begin="3.6s" repeatCount="indefinite"
      path="M1174,360 L1182,360 C1196,360 1196,430 1174,430 L726,430"/>
  </circle>
  <circle r="7" fill="url(#tok)">
    <animateMotion dur="6s" begin="4.6s" repeatCount="indefinite"
      path="M726,430 L662,430"/>
  </circle>

  <!-- subtle pulse on the OUTPUT binaries panel when token arrives -->
  <rect x="488" y="404" width="174" height="52" rx="10" fill="#34d399" opacity="0">
    <animate attributeName="opacity" values="0;0.12;0" dur="6s" begin="5.0s" repeatCount="indefinite"/>
  </rect>
</svg>
