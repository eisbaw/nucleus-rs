<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>ACFG injection passes</title>
  <desc>A control-flow tree (a Sequence with a Repeat/loop and Operation nodes) evolving through the ACFG injection passes shown along the top: block_transform, partition, halo/reuse inference, sync_inject, transfer_inject. The active pass label lights up in turn on a looping cycle; as each pass activates new annotation nodes pop into the tree — amber Sync(barrier) nodes and cyan Push/Wait pairs — so the tree grows richer with every pass. A loop arc rotates on the Repeat node and cyan tokens flow down the tree edges.</desc>

  <style>
    text { fill:#e2e8f0; }
    .title  { fill:#e2e8f0; font-size:28px; font-weight:700; }
    .sub    { fill:#94a3b8; font-size:16px; }
    .tag    { fill:#94a3b8; font-size:13px; font-weight:600; letter-spacing:1px; }
    .nodeT  { font-size:16px; font-weight:600; text-anchor:middle; }
    .nodeS  { font-size:12px; fill:#94a3b8; text-anchor:middle; }
    .annT   { font-size:14px; font-weight:600; text-anchor:middle; }
    .annS   { font-size:11px; text-anchor:middle; }

    /* ============================================================
       MASTER CYCLE = 15s.  Five passes, ~3s each.
       Pass k is "active" during [k*20% .. (k+1)*20%].
       Annotation nodes introduced by a pass pop in at that pass
       and stay visible for the remainder of the cycle, so the
       tree gets monotonically richer until the loop resets.
       ============================================================ */

    /* --- pass label highlight: each label is dim, lights up in its window --- */
    .passLbl { animation: passDim 15s linear infinite; }
    @keyframes passDim {
      0%,100% { opacity:0.4; }
    }
    .p0 { animation: passOn0 15s linear infinite; }
    .p1 { animation: passOn1 15s linear infinite; }
    .p2 { animation: passOn2 15s linear infinite; }
    .p3 { animation: passOn3 15s linear infinite; }
    .p4 { animation: passOn4 15s linear infinite; }
    @keyframes passOn0 { 0%,18%{opacity:1} 22%,100%{opacity:0.4} }
    @keyframes passOn1 { 0%,18%{opacity:0.4} 20%,38%{opacity:1} 42%,100%{opacity:0.4} }
    @keyframes passOn2 { 0%,38%{opacity:0.4} 40%,58%{opacity:1} 62%,100%{opacity:0.4} }
    @keyframes passOn3 { 0%,58%{opacity:0.4} 60%,78%{opacity:1} 82%,100%{opacity:0.4} }
    @keyframes passOn4 { 0%,78%{opacity:0.4} 80%,98%{opacity:1} 100%{opacity:0.4} }

    /* the active-pass pill background glows in turn */
    .pill0 { animation: pill0 15s linear infinite; }
    .pill1 { animation: pill1 15s linear infinite; }
    .pill2 { animation: pill2 15s linear infinite; }
    .pill3 { animation: pill3 15s linear infinite; }
    .pill4 { animation: pill4 15s linear infinite; }
    @keyframes pill0 { 0%,18%{stroke:#22d3ee;fill:#10242b} 22%,100%{stroke:#334155;fill:#1e293b} }
    @keyframes pill1 { 0%,18%{stroke:#334155;fill:#1e293b} 20%,38%{stroke:#a78bfa;fill:#1d1a33} 42%,100%{stroke:#334155;fill:#1e293b} }
    @keyframes pill2 { 0%,38%{stroke:#334155;fill:#1e293b} 40%,58%{stroke:#22d3ee;fill:#10242b} 62%,100%{stroke:#334155;fill:#1e293b} }
    @keyframes pill3 { 0%,58%{stroke:#334155;fill:#1e293b} 60%,78%{stroke:#fbbf24;fill:#2a230c} 82%,100%{stroke:#334155;fill:#1e293b} }
    @keyframes pill4 { 0%,78%{stroke:#334155;fill:#1e293b} 80%,98%{stroke:#22d3ee;fill:#10242b} 100%{stroke:#334155;fill:#1e293b} }

    /* sweeping progress underline beneath the pass row */
    .sweep { animation: sweep 15s linear infinite; }
    @keyframes sweep {
      0%   { transform: translateX(0);    }
      100% { transform: translateX(872px);}
    }

    /* ---- annotation pop-ins. Each appears at its pass window, then holds. ---- */
    /* partition (pass1, ~20%) brings the worker split chips */
    .popPart { animation: popPart 15s ease-out infinite; transform-origin:center; transform-box:fill-box; }
    @keyframes popPart {
      0%,18%   { opacity:0; transform:scale(0.4); }
      24%      { opacity:1; transform:scale(1.12); }
      28%,100% { opacity:1; transform:scale(1); }
    }
    /* halo/reuse (pass2, ~40%) brings the halo strip annotation */
    .popHalo { animation: popHalo 15s ease-out infinite; transform-origin:center; transform-box:fill-box; }
    @keyframes popHalo {
      0%,38%   { opacity:0; transform:scale(0.4); }
      44%      { opacity:1; transform:scale(1.12); }
      48%,100% { opacity:1; transform:scale(1); }
    }
    /* sync_inject (pass3, ~60%) brings the amber Sync(barrier) nodes */
    .popSync { animation: popSync 15s ease-out infinite; transform-origin:center; transform-box:fill-box; }
    @keyframes popSync {
      0%,58%   { opacity:0; transform:scale(0.4); }
      64%      { opacity:1; transform:scale(1.15); }
      68%,100% { opacity:1; transform:scale(1); }
    }
    /* transfer_inject (pass4, ~80%) brings the cyan Push/Wait pairs */
    .popXfer { animation: popXfer 15s ease-out infinite; transform-origin:center; transform-box:fill-box; }
    @keyframes popXfer {
      0%,78%   { opacity:0; transform:scale(0.4); }
      84%      { opacity:1; transform:scale(1.15); }
      88%,100% { opacity:1; transform:scale(1); }
    }

    /* rotating loop arc on the Repeat node */
    .loopArc { animation: spin 4s linear infinite; transform-origin:center; transform-box:fill-box; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* cyan tokens flowing down the tree edges */
    .tok  { animation: tokFlow 3.2s linear infinite; }
    @keyframes tokFlow {
      0%   { opacity:0; offset-distance:0%; }
      10%  { opacity:1; }
      90%  { opacity:1; }
      100% { opacity:0; offset-distance:100%; }
    }

    /* soft barrier pulse on the amber sync rule */
    .barPulse { animation: barPulse 2.4s ease-in-out infinite; }
    @keyframes barPulse { 0%,100%{opacity:0.35} 50%{opacity:0.9} }
  </style>

  <defs>
    <marker id="ahMuted" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="ahCyan" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
    <marker id="ahAmber" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#fbbf24"/>
    </marker>
    <radialGradient id="tokG" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#a5f3fc"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===================== TITLE ===================== -->
  <text x="40" y="50" class="title">ACFG injection passes</text>
  <text x="40" y="78" class="sub">the control-flow tree grows annotation nodes pass by pass</text>

  <!-- ===================== PASS ROW (top) ===================== -->
  <text x="40" y="116" class="tag">PASSES</text>
  <g transform="translate(40,128)">
    <!-- pill backgrounds -->
    <rect class="pill0" x="0"   y="0" width="196" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect class="pill1" x="216" y="0" width="196" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect class="pill2" x="432" y="0" width="196" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect class="pill3" x="648" y="0" width="196" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect class="pill4" x="864" y="0" width="212" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>

    <!-- pill labels -->
    <text class="passLbl p0" x="98"  y="22" text-anchor="middle" font-size="15" font-weight="600" fill="#22d3ee">block_transform</text>
    <text class="passLbl p0" x="98"  y="38" text-anchor="middle" font-size="11" fill="#94a3b8">tile the loop</text>

    <text class="passLbl p1" x="314" y="22" text-anchor="middle" font-size="15" font-weight="600" fill="#a78bfa">partition</text>
    <text class="passLbl p1" x="314" y="38" text-anchor="middle" font-size="11" fill="#94a3b8">workers / rows / blocks2d</text>

    <text class="passLbl p2" x="530" y="22" text-anchor="middle" font-size="15" font-weight="600" fill="#22d3ee">halo / reuse infer</text>
    <text class="passLbl p2" x="530" y="38" text-anchor="middle" font-size="11" fill="#94a3b8">boundary widths</text>

    <text class="passLbl p3" x="746" y="22" text-anchor="middle" font-size="15" font-weight="600" fill="#fbbf24">sync_inject</text>
    <text class="passLbl p3" x="746" y="38" text-anchor="middle" font-size="11" fill="#94a3b8">barriers</text>

    <text class="passLbl p4" x="970" y="22" text-anchor="middle" font-size="15" font-weight="600" fill="#22d3ee">transfer_inject</text>
    <text class="passLbl p4" x="970" y="38" text-anchor="middle" font-size="11" fill="#94a3b8">Push / Wait</text>

    <!-- inter-pass arrows -->
    <g stroke="#64748b" stroke-width="2" fill="none">
      <path d="M196,23 L214,23" marker-end="url(#ahMuted)"/>
      <path d="M412,23 L430,23" marker-end="url(#ahMuted)"/>
      <path d="M628,23 L646,23" marker-end="url(#ahMuted)"/>
      <path d="M844,23 L862,23" marker-end="url(#ahMuted)"/>
    </g>

    <!-- sweeping progress marker under the row -->
    <g class="sweep">
      <rect x="0" y="52" width="196" height="4" rx="2" fill="#22d3ee" opacity="0.9"/>
    </g>
    <line x1="0" y1="54" x2="1076" y2="54" stroke="#283548" stroke-width="2" stroke-dasharray="3 6" opacity="0.6"/>
  </g>

  <!-- ===================== THE CONTROL-FLOW TREE ===================== -->
  <text x="40" y="228" class="tag">ACFG &#8212; CONTROL-FLOW TREE</text>

  <!-- tree edges (drawn first, under nodes) -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <!-- Sequence root -> Repeat -->
    <path id="eRootRep" d="M250,300 L250,372" marker-end="url(#ahMuted)"/>
    <!-- Repeat -> body Sequence -->
    <path id="eRepBody" d="M250,438 L250,500" marker-end="url(#ahMuted)"/>
    <!-- body -> Op stencil (left)  and Op store (right) -->
    <path id="eBodyOpL" d="M250,540 C250,576 175,560 175,584" marker-end="url(#ahMuted)"/>
    <path id="eBodyOpR" d="M250,540 C250,576 470,560 470,584" marker-end="url(#ahMuted)"/>
  </g>

  <!-- flowing cyan tokens down the spine -->
  <circle class="tok" r="6" fill="url(#tokG)" style="offset-path:path('M250,300 L250,372');"/>
  <circle class="tok" r="6" fill="url(#tokG)" style="offset-path:path('M250,438 L250,500'); animation-delay:0.8s;"/>
  <circle class="tok" r="6" fill="url(#tokG)" style="offset-path:path('M250,540 C250,576 175,560 175,584'); animation-delay:1.6s;"/>
  <circle class="tok" r="6" fill="url(#tokG)" style="offset-path:path('M250,540 C250,576 470,560 470,584'); animation-delay:2.0s;"/>

  <!-- ===================== ROOT: Sequence ===================== -->
  <g>
    <rect x="160" y="252" width="180" height="48" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text class="nodeT" x="250" y="276" fill="#a78bfa">Sequence</text>
    <text class="nodeS" x="250" y="292">program root</text>
  </g>

  <!-- ===================== Repeat / loop node ===================== -->
  <g>
    <rect x="150" y="372" width="200" height="66" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text class="nodeT" x="250" y="398" fill="#fbbf24">Repeat</text>
    <text class="nodeS" x="250" y="416">iter t = 0 .. T</text>
    <text class="nodeS" x="250" y="430">loop body</text>

    <!-- rotating loop arc badge -->
    <g class="loopArc" transform="translate(322,392)">
      <path d="M0,-13 A13,13 0 1 1 -9,9" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <path d="M-9,9 l-5,-2 l1,6 z" fill="#fbbf24"/>
    </g>
  </g>

  <!-- ===================== body Sequence ===================== -->
  <g>
    <rect x="170" y="500" width="160" height="40" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text class="nodeT" x="250" y="525" font-size="14">body Sequence</text>
  </g>

  <!-- ===================== Operation leaves ===================== -->
  <g>
    <rect x="95" y="584" width="160" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text class="nodeT" x="175" y="606" font-size="14">Operation</text>
    <text class="nodeS" x="175" y="622">stencil(u)</text>
  </g>
  <g>
    <rect x="390" y="584" width="160" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text class="nodeT" x="470" y="606" font-size="14">Operation</text>
    <text class="nodeS" x="470" y="622">store(u')</text>
  </g>

  <!-- =====================================================================
       ANNOTATION NODES (pop in as passes activate)
       ===================================================================== -->

  <!-- partition (pass1): worker-split chip on the Repeat -->
  <g class="popPart">
    <rect x="380" y="300" width="176" height="60" rx="10" fill="#1d1a33" stroke="#a78bfa" stroke-width="2"/>
    <text class="annT" x="468" y="322" fill="#a78bfa">partition</text>
    <text class="annS" x="468" y="340" fill="#cbd5e1">workers w0 .. w3</text>
    <text class="annS" x="468" y="354" fill="#94a3b8">tile per worker</text>
    <!-- four worker chips -->
    <g>
      <rect x="392" y="346" width="0" height="0"/>
    </g>
    <path d="M380,330 L352,330" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ahMuted)"/>
  </g>
  <!-- worker chip row (part of partition pop) -->
  <g class="popPart">
    <g stroke="#a78bfa" stroke-width="1.5" fill="#241f40">
      <rect x="402" y="362" width="30" height="20" rx="4"/>
      <rect x="438" y="362" width="30" height="20" rx="4"/>
      <rect x="474" y="362" width="30" height="20" rx="4"/>
      <rect x="510" y="362" width="30" height="20" rx="4"/>
    </g>
    <g font-size="10" fill="#c4b5fd" text-anchor="middle">
      <text x="417" y="376">w0</text>
      <text x="453" y="376">w1</text>
      <text x="489" y="376">w2</text>
      <text x="525" y="376">w3</text>
    </g>
  </g>

  <!-- halo / reuse (pass2): halo strip annotation on stencil op -->
  <g class="popHalo">
    <rect x="55" y="528" width="150" height="46" rx="10" fill="#10242b" stroke="#22d3ee" stroke-width="2"/>
    <text class="annT" x="130" y="548" fill="#22d3ee">halo strip</text>
    <text class="annS" x="130" y="565" fill="#94a3b8">width = 1 each side</text>
    <path d="M150,574 C150,584 165,580 173,586" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- sync_inject (pass3): amber Sync(barrier) nodes -->
  <!-- barrier before the body (top of loop) -->
  <g class="popSync">
    <rect x="600" y="392" width="190" height="54" rx="10" fill="#2a230c" stroke="#fbbf24" stroke-width="2"/>
    <text class="annT" x="695" y="414" fill="#fbbf24">Sync(barrier)</text>
    <text class="annS" x="695" y="431" fill="#94a3b8">tag = epoch &#183; all workers</text>
    <path d="M600,419 L352,408" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ahAmber)"/>
    <!-- pulsing barrier rule -->
    <line class="barPulse" x1="610" y1="446" x2="780" y2="446" stroke="#fbbf24" stroke-width="2"/>
  </g>
  <!-- barrier after the body (bottom of loop) -->
  <g class="popSync">
    <rect x="600" y="500" width="190" height="46" rx="10" fill="#2a230c" stroke="#fbbf24" stroke-width="2"/>
    <text class="annT" x="695" y="521" fill="#fbbf24">Sync(barrier)</text>
    <text class="annS" x="695" y="537" fill="#94a3b8">end-of-iter join</text>
    <path d="M600,523 L332,521" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ahAmber)"/>
  </g>

  <!-- transfer_inject (pass4): cyan Push / Wait pairs -->
  <!-- Push attached to the producer (store) op -->
  <g class="popXfer">
    <rect x="560" y="584" width="124" height="48" rx="10" fill="#10242b" stroke="#22d3ee" stroke-width="2"/>
    <text class="annT" x="622" y="605" fill="#22d3ee">Push</text>
    <text class="annS" x="622" y="622" fill="#94a3b8">halo &#8594; neighbour</text>
    <path d="M560,608 L552,608" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#ahCyan)"/>
  </g>
  <!-- Wait attached to the consumer (stencil) op -->
  <g class="popXfer">
    <rect x="694" y="584" width="124" height="48" rx="10" fill="#10242b" stroke="#22d3ee" stroke-width="2"/>
    <text class="annT" x="756" y="605" fill="#22d3ee">Wait</text>
    <text class="annS" x="756" y="622" fill="#94a3b8">recv before read</text>
  </g>
  <!-- Push -> Wait pairing arrow (the cross-worker transfer) -->
  <g class="popXfer">
    <path id="ePushWait" d="M684,624 C690,648 698,648 700,632" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ahCyan)"/>
  </g>
  <!-- packet riding the Push->Wait pairing -->
  <g class="popXfer">
    <circle class="tok" r="5" fill="url(#tokG)" style="offset-path:path('M684,624 C690,648 698,648 700,632'); animation-duration:2.2s;"/>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g transform="translate(880,250)">
    <text x="0" y="0" class="tag">LEGEND</text>
    <rect x="0" y="14" width="18" height="14" rx="4" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="26" y="26" font-size="13" fill="#94a3b8">control node (Seq / Repeat / Op)</text>

    <rect x="0" y="40" width="18" height="14" rx="4" fill="#2a230c" stroke="#fbbf24" stroke-width="2"/>
    <text x="26" y="52" font-size="13" fill="#94a3b8">Sync(barrier) &#8212; sync_inject</text>

    <rect x="0" y="66" width="18" height="14" rx="4" fill="#10242b" stroke="#22d3ee" stroke-width="2"/>
    <text x="26" y="78" font-size="13" fill="#94a3b8">Push / Wait &#8212; transfer_inject</text>

    <rect x="0" y="92" width="18" height="14" rx="4" fill="#1d1a33" stroke="#a78bfa" stroke-width="2"/>
    <text x="26" y="104" font-size="13" fill="#94a3b8">partition / halo annotation</text>
  </g>

  <!-- caption -->
  <text x="40" y="624" font-size="13" fill="#64748b">each pass injects only what the schedule requires &#8212; the verified Petri model is built from this enriched tree</text>
</svg>
