<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <!-- Hub glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- A single MCU chip drawn once and instanced via <use>. -->
    <g id="mcu">
      <rect x="-90" y="-66" width="180" height="132" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <!-- chip pins -->
      <g stroke="#334155" stroke-width="2">
        <line x1="-90" y1="-40" x2="-104" y2="-40"/>
        <line x1="-90" y1="-14" x2="-104" y2="-14"/>
        <line x1="-90" y1="12"  x2="-104" y2="12"/>
        <line x1="-90" y1="38"  x2="-104" y2="38"/>
        <line x1="90" y1="-40" x2="104" y2="-40"/>
        <line x1="90" y1="-14" x2="104" y2="-14"/>
        <line x1="90" y1="12"  x2="104" y2="12"/>
        <line x1="90" y1="38"  x2="104" y2="38"/>
      </g>
      <!-- inner die -->
      <rect x="-60" y="-44" width="120" height="64" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="0" y="-20" text-anchor="middle" font-size="15" font-weight="700" fill="#a78bfa">STM32H7</text>
      <text x="0" y="2" text-anchor="middle" font-size="12.5" fill="#94a3b8">no_std fw</text>
    </g>

    <!-- packet square, reused for every token -->
    <g id="packet">
      <rect x="-13" y="-13" width="26" height="26" rx="5" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
    </g>

    <!-- Motion paths (invisible) for animateMotion mpath references. -->
    <!-- A: MCU-A (250,170) -> hub (580,280) -->
    <path id="pathA2H" d="M 250 200 Q 420 250 580 280" fill="none"/>
    <!-- hub -> MCU-C (910,170), then later back along C2H for the return leg -->
    <path id="pathH2C" d="M 580 280 Q 740 250 910 200" fill="none"/>
    <!-- return: MCU-C -> hub -->
    <path id="pathC2H" d="M 910 200 Q 740 250 580 280" fill="none"/>
    <!-- hub -> MCU-A -->
    <path id="pathH2A" d="M 580 280 Q 420 250 250 200" fill="none"/>
    <!-- hub -> MCU-B (580,470) and back -->
    <path id="pathH2B" d="M 580 320 L 580 410" fill="none"/>
    <path id="pathB2H" d="M 580 410 L 580 320" fill="none"/>
  </defs>

  <!-- ===================== TITLE ===================== -->
  <text x="60" y="56" font-size="28" font-weight="700" fill="#e2e8f0">Embedded multi-MCU co-simulation</text>
  <text x="60" y="86" font-size="16" fill="#94a3b8">Renode runs three machines side by side, exchanging messages over a shared UART hub</text>

  <!-- ===================== LINKS (drawn under chips/hub) ===================== -->
  <g stroke-width="3" fill="none" stroke-linecap="round">
    <!-- A <-> hub -->
    <path d="M 250 200 Q 420 250 580 280" stroke="#334155"/>
    <!-- C <-> hub -->
    <path d="M 580 280 Q 740 250 910 200" stroke="#334155"/>
    <!-- B <-> hub -->
    <path d="M 580 320 L 580 410" stroke="#334155"/>

    <!-- animated dash overlays to suggest live wires -->
    <path d="M 250 200 Q 420 250 580 280" stroke="#22d3ee" stroke-opacity="0.30" stroke-dasharray="6 14">
      <animate attributeName="stroke-dashoffset" values="40;0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 580 280 Q 740 250 910 200" stroke="#22d3ee" stroke-opacity="0.30" stroke-dasharray="6 14">
      <animate attributeName="stroke-dashoffset" values="40;0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 580 320 L 580 410" stroke="#22d3ee" stroke-opacity="0.30" stroke-dasharray="6 14">
      <animate attributeName="stroke-dashoffset" values="40;0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- link labels -->
  <text x="400" y="222" text-anchor="middle" font-size="13" fill="#94a3b8">link_push (TX)</text>
  <text x="772" y="222" text-anchor="middle" font-size="13" fill="#94a3b8">link_recv (RX)</text>
  <text x="600" y="368" font-size="13" fill="#94a3b8">blocking RX</text>

  <!-- ===================== UART HUB (center) ===================== -->
  <circle cx="580" cy="280" r="78" fill="url(#hubGlow)"/>
  <g>
    <circle cx="580" cy="280" r="56" fill="#1e293b" stroke="#22d3ee" stroke-width="2.5"/>
    <!-- rotating ring to imply routing -->
    <g>
      <circle cx="580" cy="280" r="46" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.55"
              stroke-dasharray="10 18"/>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 580 280" to="360 580 280" dur="6s" repeatCount="indefinite"/>
    </g>
    <text x="580" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#22d3ee">UART</text>
    <text x="580" y="294" text-anchor="middle" font-size="14" fill="#e2e8f0">hub</text>
  </g>

  <!-- ===================== THREE MCUs ===================== -->
  <!-- MCU A (left) -->
  <use href="#mcu" x="250" y="170"/>
  <text x="250" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#34d399">machine A</text>
  <!-- MCU C (right) -->
  <use href="#mcu" x="910" y="170"/>
  <text x="910" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#34d399">machine C</text>
  <!-- MCU B (bottom) -->
  <use href="#mcu" x="580" y="476"/>
  <text x="700" y="481" text-anchor="middle" font-size="15" font-weight="700" fill="#34d399">machine B</text>

  <!-- ===================== TRAVELLING PACKETS ===================== -->
  <!-- Packet 1: A -> hub -> C, then C -> hub -> A (full round trip), 8s loop. -->
  <g>
    <use href="#packet"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#22d3ee">p0</text>
    <!-- leg 1: A -> hub -->
    <animateMotion dur="8s" repeatCount="indefinite" begin="0s" keyPoints="0;1" keyTimes="0;1" calcMode="linear"
                   rotate="0">
      <mpath href="#pathA2H"/>
    </animateMotion>
  </g>

  <!-- Because chained legs are clearer as separate tokens, we run four staged packets
       that visually compose into one continuous A->hub->C->hub->A circuit. -->

  <!-- Token T1: A -> hub (visible 0..1.8s of a 7.2s cycle) -->
  <g opacity="0">
    <use href="#packet"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#22d3ee">A</text>
    <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite"
             values="0;1;1;0;0;0;0;0" keyTimes="0;0.02;0.23;0.27;0.5;0.75;0.9;1"/>
    <animateMotion dur="7.2s" repeatCount="indefinite" begin="0s"
                   keyPoints="0;0;1;1;1;1;1;1" keyTimes="0;0.02;0.25;0.27;0.5;0.75;0.9;1" calcMode="linear">
      <mpath href="#pathA2H"/>
    </animateMotion>
  </g>

  <!-- Token T2: hub -> C -->
  <g opacity="0">
    <use href="#packet"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#22d3ee">C</text>
    <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite"
             values="0;0;1;1;0;0;0;0" keyTimes="0;0.25;0.27;0.5;0.53;0.75;0.9;1"/>
    <animateMotion dur="7.2s" repeatCount="indefinite" begin="0s"
                   keyPoints="0;0;0;1;1;1;1;1" keyTimes="0;0.25;0.27;0.5;0.53;0.75;0.9;1" calcMode="linear">
      <mpath href="#pathH2C"/>
    </animateMotion>
  </g>

  <!-- Token T3: C -> hub (reply) -->
  <g opacity="0">
    <use href="#packet"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#34d399">R</text>
    <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite"
             values="0;0;0;1;1;0;0;0" keyTimes="0;0.5;0.53;0.55;0.75;0.78;0.9;1"/>
    <animateMotion dur="7.2s" repeatCount="indefinite" begin="0s"
                   keyPoints="0;0;0;0;1;1;1;1" keyTimes="0;0.5;0.53;0.55;0.75;0.78;0.9;1" calcMode="linear">
      <mpath href="#pathC2H"/>
    </animateMotion>
  </g>

  <!-- Token T4: hub -> A (reply lands) -->
  <g opacity="0">
    <use href="#packet"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#34d399">R</text>
    <animate attributeName="opacity" dur="7.2s" repeatCount="indefinite"
             values="0;0;0;0;1;1;0;0" keyTimes="0;0.75;0.77;0.78;0.8;0.97;0.99;1"/>
    <animateMotion dur="7.2s" repeatCount="indefinite" begin="0s"
                   keyPoints="0;0;0;0;0;1;1;1" keyTimes="0;0.75;0.77;0.78;0.8;0.97;0.99;1" calcMode="linear">
      <mpath href="#pathH2A"/>
    </animateMotion>
  </g>

  <!-- Hide the simple full-loop p0 token (kept invisible; the staged tokens tell the story) -->
  <!-- (p0 group above stays visible as a faint continuous courier on the A->hub arc) -->

  <!-- Token B-out: hub -> B (blocking RX demo) -->
  <g opacity="0">
    <use href="#packet"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fbbf24">b</text>
    <animate attributeName="opacity" dur="4.5s" repeatCount="indefinite"
             values="0;1;1;0;0" keyTimes="0;0.05;0.45;0.5;1"/>
    <animateMotion dur="4.5s" repeatCount="indefinite" begin="0.6s"
                   keyPoints="0;0;1;1;1" keyTimes="0;0.05;0.45;0.5;1" calcMode="linear">
      <mpath href="#pathH2B"/>
    </animateMotion>
  </g>
  <!-- Token B-in: B -> hub -->
  <g opacity="0">
    <use href="#packet"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#34d399">b</text>
    <animate attributeName="opacity" dur="4.5s" repeatCount="indefinite"
             values="0;0;1;1;0" keyTimes="0;0.5;0.55;0.95;1"/>
    <animateMotion dur="4.5s" repeatCount="indefinite" begin="0.6s"
                   keyPoints="0;0;0;1;1" keyTimes="0;0.5;0.55;0.95;1" calcMode="linear">
      <mpath href="#pathB2H"/>
    </animateMotion>
  </g>

  <!-- Hub pulse when a packet arrives -->
  <circle cx="580" cy="280" r="56" fill="none" stroke="#22d3ee" stroke-width="2">
    <animate attributeName="r" values="56;66;56" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.7;0;0.7" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- ===================== CAPTION ===================== -->
  <g>
    <rect x="60" y="500" width="520" height="40" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="86" cy="520" r="7" fill="#34d399">
      <animate attributeName="fill-opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="106" y="525" font-size="16" fill="#e2e8f0">no_std firmware, byte-exact across co-simulated MCUs.</text>
  </g>
</svg>
