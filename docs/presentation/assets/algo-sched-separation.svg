<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Algorithm / Schedule separation</title>
  <desc>Two panels — Algorithm (violet, what to compute) and Schedule (amber, how and where it runs) — periodically slide together over a plus sign into one combined executable program panel (emerald), then reset. Same algorithm plus a different schedule yields a different target.</desc>

  <style>
    :root { color-scheme: dark; }
    text { fill: #e2e8f0; }

    /* ---- master cycle: 12s. Phases:
         0-42%  : panels apart, contents animate
         42-58% : slide together toward centre
         58-80% : merged emerald program shown
         80-92% : slide back apart
         92-100%: settle  ---- */

    .leftGroup  { animation: slideLeft  12s ease-in-out infinite; }
    .rightGroup { animation: slideRight 12s ease-in-out infinite; }
    @keyframes slideLeft {
      0%,42%   { transform: translateX(0); }
      58%,80%  { transform: translateX(305px); }
      92%,100% { transform: translateX(0); }
    }
    @keyframes slideRight {
      0%,42%   { transform: translateX(0); }
      58%,80%  { transform: translateX(-305px); }
      92%,100% { transform: translateX(0); }
    }

    /* the two separate panels fade out as the merged panel fades in */
    .splitFade { animation: splitFade 12s ease-in-out infinite; }
    @keyframes splitFade {
      0%,52%   { opacity: 1; }
      60%,78%  { opacity: 0; }
      88%,100% { opacity: 1; }
    }
    .mergeFade { animation: mergeFade 12s ease-in-out infinite; }
    @keyframes mergeFade {
      0%,54%   { opacity: 0; }
      62%,78%  { opacity: 1; }
      86%,100% { opacity: 0; }
    }

    /* plus sign pulses while apart, hides on merge */
    .plus { animation: plusPulse 12s ease-in-out infinite; transform-origin: 550px 300px; }
    @keyframes plusPulse {
      0%      { opacity: 0.85; transform: scale(1); }
      21%     { opacity: 1;    transform: scale(1.18); }
      42%     { opacity: 0.85; transform: scale(1); }
      55%,80% { opacity: 0;    transform: scale(0.4); }
      94%,100%{ opacity: 0.85; transform: scale(1); }
    }

    /* equals sign appears only on merge */
    .eq { animation: eqShow 12s ease-in-out infinite; }
    @keyframes eqShow {
      0%,56%   { opacity: 0; }
      64%,78%  { opacity: 1; }
      85%,100% { opacity: 0; }
    }

    /* dataflow tokens travelling along the algorithm edges */
    .tok { animation: tokFlow 3s linear infinite; }
    .tok2 { animation: tokFlow 3s linear infinite; animation-delay: 1s; }
    .tok3 { animation: tokFlow 3s linear infinite; animation-delay: 2s; }
    @keyframes tokFlow {
      0%   { opacity: 0; offset-distance: 0%; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { opacity: 0; offset-distance: 100%; }
    }

    /* algorithm nodes light up in sequence */
    .nA { animation: pulseA 3s ease-in-out infinite; }
    .nB { animation: pulseA 3s ease-in-out infinite; animation-delay: 0.7s; }
    .nC { animation: pulseA 3s ease-in-out infinite; animation-delay: 1.4s; }
    .nD { animation: pulseA 3s ease-in-out infinite; animation-delay: 2.1s; }
    @keyframes pulseA {
      0%,100% { fill: #2a2150; stroke: #a78bfa; }
      18%     { fill: #a78bfa; stroke: #c4b5fd; }
      40%     { fill: #2a2150; stroke: #a78bfa; }
    }

    /* schedule workers light up one after another */
    .wk0 { animation: pulseW 3s ease-in-out infinite; }
    .wk1 { animation: pulseW 3s ease-in-out infinite; animation-delay: 0.5s; }
    .wk2 { animation: pulseW 3s ease-in-out infinite; animation-delay: 1.0s; }
    .wk3 { animation: pulseW 3s ease-in-out infinite; animation-delay: 1.5s; }
    @keyframes pulseW {
      0%,100% { fill: #3a2c0c; stroke: #fbbf24; }
      20%     { fill: #fbbf24; stroke: #fde68a; }
      45%     { fill: #3a2c0c; stroke: #fbbf24; }
    }

    /* cross-worker transfer packet */
    .xfer { animation: xferFlow 2.4s ease-in-out infinite; }
    @keyframes xferFlow {
      0%,100% { opacity: 0; offset-distance: 0%; }
      10%     { opacity: 1; }
      90%     { opacity: 1; offset-distance: 100%; }
    }

    /* merged program: execution sweep across the lanes */
    .lane0 { animation: laneRun 2.6s ease-in-out infinite; }
    .lane1 { animation: laneRun 2.6s ease-in-out infinite; animation-delay: 0.4s; }
    .lane2 { animation: laneRun 2.6s ease-in-out infinite; animation-delay: 0.8s; }
    @keyframes laneRun {
      0%,100% { opacity: 0.25; }
      45%     { opacity: 1; }
    }
    .runDot { animation: runDot 2.6s linear infinite; }
    @keyframes runDot {
      0%   { opacity: 0; offset-distance: 0%; }
      6%   { opacity: 1; }
      94%  { opacity: 1; }
      100% { opacity: 0; offset-distance: 100%; }
    }

    .caption { animation: capFade 12s ease-in-out infinite; }
    @keyframes capFade {
      0%,52%   { opacity: 0.92; }
      60%,78%  { opacity: 0; }
      88%,100% { opacity: 0.92; }
    }
    .capMerge { animation: capMerge 12s ease-in-out infinite; }
    @keyframes capMerge {
      0%,56%   { opacity: 0; }
      66%,78%  { opacity: 0.95; }
      86%,100% { opacity: 0; }
    }
  </style>

  <!-- offset paths for tokens (declared as CSS custom anim via offset-path on inline style) -->
  <defs>
    <marker id="arrowV" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowE" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- ===================== HEADER ===================== -->
  <text x="550" y="44" text-anchor="middle" font-size="28" font-weight="700">Algorithm / Schedule Separation</text>
  <text x="550" y="74" text-anchor="middle" font-size="16" fill="#94a3b8">same algorithm &#8226; different schedule &#8594; different target</text>

  <!-- ===================== SPLIT VIEW (two panels + plus) ===================== -->
  <g class="splitFade">

    <!-- LEFT: ALGORITHM (violet) -->
    <g class="leftGroup">
      <rect x="60" y="110" width="420" height="380" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
      <text x="270" y="146" text-anchor="middle" font-size="20" font-weight="700" fill="#a78bfa">ALGORITHM</text>
      <text x="270" y="170" text-anchor="middle" font-size="14" fill="#94a3b8">what to compute</text>

      <!-- abstract dataflow edges -->
      <g stroke="#7c6fbf" stroke-width="2" fill="none">
        <path id="eAB" d="M150,250 L240,210" marker-end="url(#arrowV)"/>
        <path id="eAC" d="M150,250 L240,310" marker-end="url(#arrowV)"/>
        <path id="eBD" d="M310,210 L390,360" marker-end="url(#arrowV)"/>
        <path id="eCD" d="M310,310 L390,360" marker-end="url(#arrowV)"/>
      </g>

      <!-- flowing tokens along the edges -->
      <circle class="tok"  r="5" fill="#22d3ee" style="offset-path: path('M150,250 L240,210');"/>
      <circle class="tok2" r="5" fill="#22d3ee" style="offset-path: path('M150,250 L240,310');"/>
      <circle class="tok3" r="5" fill="#22d3ee" style="offset-path: path('M310,310 L390,360');"/>
      <circle class="tok2" r="5" fill="#22d3ee" style="offset-path: path('M310,210 L390,360');"/>

      <!-- abstract nodes -->
      <g stroke-width="2">
        <circle class="nA" cx="150" cy="250" r="24"/>
        <circle class="nB" cx="270" cy="210" r="24"/>
        <circle class="nC" cx="270" cy="310" r="24"/>
        <circle class="nD" cx="390" cy="360" r="24"/>
      </g>
      <g font-size="14" fill="#e2e8f0" text-anchor="middle">
        <text x="150" y="255">in</text>
        <text x="270" y="215">f</text>
        <text x="270" y="315">g</text>
        <text x="390" y="365">out</text>
      </g>

      <text x="270" y="455" text-anchor="middle" font-size="13" fill="#94a3b8" font-style="italic">pure dataflow &#8226; no order, no place</text>
    </g>

    <!-- PLUS -->
    <g class="plus">
      <circle cx="550" cy="300" r="30" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <path d="M550,282 L550,318 M532,300 L568,300" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- RIGHT: SCHEDULE (amber) -->
    <g class="rightGroup">
      <rect x="620" y="110" width="420" height="380" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
      <text x="830" y="146" text-anchor="middle" font-size="20" font-weight="700" fill="#fbbf24">SCHEDULE</text>
      <text x="830" y="170" text-anchor="middle" font-size="14" fill="#94a3b8">how &amp; where it runs</text>

      <!-- worker / tile grid -->
      <g stroke-width="2">
        <rect class="wk0" x="660"  y="210" width="78" height="78" rx="8"/>
        <rect class="wk1" x="756"  y="210" width="78" height="78" rx="8"/>
        <rect class="wk2" x="852"  y="210" width="78" height="78" rx="8"/>
        <rect class="wk3" x="948"  y="210" width="78" height="78" rx="8"/>
      </g>
      <g font-size="13" fill="#fde68a" text-anchor="middle" font-weight="600">
        <text x="699"  y="254">w0</text>
        <text x="795"  y="254">w1</text>
        <text x="891"  y="254">w2</text>
        <text x="987"  y="254">w3</text>
      </g>
      <g font-size="11" fill="#94a3b8" text-anchor="middle">
        <text x="699"  y="273">tile</text>
        <text x="795"  y="273">tile</text>
        <text x="891"  y="273">tile</text>
        <text x="987"  y="273">tile</text>
      </g>

      <!-- transfer arrows between adjacent workers -->
      <g stroke="#b07f14" stroke-width="2" fill="none">
        <path id="t01" d="M738,330 L756,330" marker-end="url(#arrowA)"/>
        <path id="t12" d="M834,330 L852,330" marker-end="url(#arrowA)"/>
        <path id="t23" d="M930,330 L948,330" marker-end="url(#arrowA)"/>
      </g>
      <line x1="660" y1="330" x2="1026" y2="330" stroke="#3f3a2a" stroke-width="2" stroke-dasharray="4 5"/>

      <!-- cross-worker transfer packets (halo / boundary exchange) -->
      <circle class="xfer" r="5" fill="#22d3ee" style="offset-path: path('M699,330 L795,330');"/>
      <circle class="xfer" r="5" fill="#22d3ee" style="offset-path: path('M795,330 L891,330'); animation-delay:0.6s;"/>
      <circle class="xfer" r="5" fill="#22d3ee" style="offset-path: path('M891,330 L987,330'); animation-delay:1.2s;"/>

      <text x="843" y="370" text-anchor="middle" font-size="13" fill="#94a3b8">partition &#8226; tile &#8226; place &#8226; transfer</text>
      <text x="843" y="455" text-anchor="middle" font-size="13" fill="#94a3b8" font-style="italic">choices: pthreads &#8226; MPI &#8226; no_std MCU</text>
    </g>

  </g>

  <!-- ===================== MERGED VIEW (emerald executable program) ===================== -->
  <g class="mergeFade">
    <rect x="250" y="110" width="600" height="380" rx="10" fill="#16261f" stroke="#34d399" stroke-width="2"/>
    <text x="550" y="148" text-anchor="middle" font-size="20" font-weight="700" fill="#34d399">EXECUTABLE PROGRAM</text>
    <text x="550" y="172" text-anchor="middle" font-size="14" fill="#94a3b8">algorithm &#8855; schedule, lowered for a target</text>

    <!-- equals badge -->
    <g class="eq">
      <text x="550" y="206" text-anchor="middle" font-size="16" fill="#cbd5e1">
        <tspan fill="#a78bfa" font-weight="700">f&#8728;g</tspan>
        <tspan dx="6">mapped onto</tspan>
        <tspan dx="6" fill="#fbbf24" font-weight="700">w0&#8230;w3</tspan>
      </text>
    </g>

    <!-- three execution lanes, each a worker running the fused algorithm -->
    <g stroke="#34d399" stroke-width="2" fill="#10231b">
      <rect class="lane0" x="300" y="240" width="500" height="56" rx="8"/>
      <rect class="lane1" x="300" y="312" width="500" height="56" rx="8"/>
      <rect class="lane2" x="300" y="384" width="500" height="56" rx="8"/>
    </g>

    <g font-size="13" fill="#a7f3d0" font-weight="600">
      <text x="316" y="273">w0</text>
      <text x="316" y="345">w1</text>
      <text x="316" y="417">w2</text>
    </g>

    <!-- stage chips inside each lane: in -> f -> g -> out -->
    <g font-size="12" text-anchor="middle">
      <g fill="#94a3b8">
        <text x="430" y="273">in</text><text x="540" y="273">f</text><text x="650" y="273">g</text><text x="762" y="273">out</text>
        <text x="430" y="345">in</text><text x="540" y="345">f</text><text x="650" y="345">g</text><text x="762" y="345">out</text>
        <text x="430" y="417">in</text><text x="540" y="417">f</text><text x="650" y="417">g</text><text x="762" y="417">out</text>
      </g>
    </g>

    <!-- running execution dots sweeping each lane left to right -->
    <circle class="runDot" r="6" fill="#fbbf24" style="offset-path: path('M360,268 L780,268');"/>
    <circle class="runDot" r="6" fill="#fbbf24" style="offset-path: path('M360,340 L780,340'); animation-delay:0.4s;"/>
    <circle class="runDot" r="6" fill="#fbbf24" style="offset-path: path('M360,412 L780,412'); animation-delay:0.8s;"/>

    <text x="550" y="470" text-anchor="middle" font-size="13" fill="#6ee7b7">verified equivalent &#8226; one source, many targets</text>
  </g>

  <!-- ===================== CAPTIONS ===================== -->
  <text class="caption" x="550" y="526" text-anchor="middle" font-size="15" fill="#94a3b8">Nucleus keeps the two concerns orthogonal &#8212; recompose to retarget without rewriting.</text>
  <text class="capMerge" x="550" y="526" text-anchor="middle" font-size="15" fill="#34d399">Compose &#8594; a single executable program for the chosen backend.</text>
</svg>
