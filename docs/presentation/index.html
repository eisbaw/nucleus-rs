<h2 id="what-is-nucleus">What is Nucleus?</h2>
<p>A <strong>two-file pre-compiler</strong>. Every program is split in two:</p>
<ul>
<li><strong>Algorithm</strong> (<code>*.algo.nuc</code>) — <em>what</em> to compute. Backend-agnostic.</li>
<li><strong>Schedule</strong> (<code>*.sched.nuc</code>) — <em>how</em> and <em>where</em> it runs.</li>
</ul>
<p>The scheduler lowers both into a <strong>deterministic, bounded Petri-net IR</strong>, then projects per-worker <strong>EventLists</strong> that <em>10 backends</em> turn into real code.</p>
<blockquote>
<p><code>schedule : (AlgoIR, SchedIR) → ( GlobalNet, { WorkerId → EventList } )</code></p>
</blockquote>
<p><strong>18 examples · 10 backends · 3 deployment tiers · bit-identical output as the oracle</strong></p>
</section>

<ul>
<li>The algorithm file holds <strong>no</strong> workers, buffers, or IO semantics.</li>
<li>The schedule owns <strong>placement, partition, blocking, transport, IO</strong>.</li>
<li><em>Same algorithm + different schedule = a different target.</em></li>
</ul>

<h2 id="motivation--why-bother">Motivation — why bother</h2>
<p>Hand-written parallel / distributed / embedded code is:</p>
<ul>
<li><strong>Fragile</strong> — deadlocks, races, buffer mis-sizing, off-by-one halos.</li>
<li><strong>Non-portable</strong> — thread code gets <em>rewritten</em> for MPI, ARM, an NPU.</li>
</ul>
<p>Nucleus shifts correctness <strong>left</strong>:</p>
<ul>
<li>Change the schedule → never touch the algorithm.</li>
<li>Change the backend → never touch the schedule.</li>
<li>Boundedness + deadlock are decided <strong>at compile time</strong>.</li>
</ul>
<blockquote>
<p>A stall is a <strong>compile error</strong>, not a runtime surprise.</p>
</blockquote>
</section>

<h2 id="origin--influences">Origin &amp; influences</h2>
<ul>
<li>Re-derives a <strong>2013 ISP-firmware thesis</strong> — on hardware everyone has, with the genericity claim made <em>mechanically falsifiable</em>.</li>
<li><strong>Borrowed (one idea):</strong> the <em>algorithm / schedule split</em> from <strong>Halide</strong> (cf. TVM, Tiramisu, Exo).</li>
<li><strong>Extended:</strong> IO semantics — <code>sync</code> / <code>async</code> / <code>buffer=N</code> / <code>notify</code> — become <strong>first-class schedule directives</strong>.</li>
<li><strong>Novel core:</strong> lower the <em>whole program</em> onto one small <strong>static Petri-net IR</strong> (~500 LoC, bounded, statically-ordered).</li>
<li>The model is proven by a <strong>green tier-1 differential matrix</strong>, not by argument.</li>
</ul>
</section>

<ul>
<li>3-phase lifecycle: <strong>prd-grill → backlog-snowball → backlog-ralph</strong>.</li>
<li>One <em>orchestrator</em>, one <em>implementer</em> per task, a <strong>mandatory read-only review gate</strong> (qa + architect). Roles are separated <em>on purpose</em>.</li>
<li><strong>Honest-failure discipline:</strong> Blocked beats fake-complete; no AC-gaming.</li>
<li>Scale: <strong>~542 tasks (502 Done) · 1027 commits</strong>.</li>
</ul>

<h2 id="the-two-nuc-languages">The two <code>.nuc</code> languages</h2>
<table>
<thead>
<tr>
<th>Algorithm (<code>*.algo.nuc</code>)</th>
<th>Schedule (<code>*.sched.nuc</code>)</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>const</code>, <code>data</code>, shape-typed <code>kernel</code></td>
<td><code>workers</code>, <code>place</code>, <code>partition</code></td>
</tr>
<tr>
<td>dataflow with <code>&lt;--</code> over <code>for</code></td>
<td><code>transfer</code>, <code>check loop</code></td>
</tr>
<tr>
<td><strong>forbids</strong> workers &amp; directives</td>
<td><strong>forbids</strong> kernel bodies &amp; control flow</td>
</tr>
</tbody>
</table>
<ul>
<li>Kernel bodies are <strong>real Rust</strong> in an adjacent file — <em>never</em> text-substituted.</li>
<li>One algorithm runs under <strong>many</strong> schedules (example 01 ships six).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="nucleus" lang="en-DK" data-marpit-pagination="8" style="--paginate:true;--theme:nucleus;" data-marpit-pagination-total="21" data-size="16:9">
<h2 id="a-concrete-example--the-algorithm">A concrete example — the algorithm</h2>
<p><code>01-elementwise-add</code> — <code>c[i] = a[i] + b[i]</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-rust"><span class="hljs-keyword">const</span> N : <span class="hljs-type">usize</span> = <span class="hljs-number">256</span>;
data a : <span class="hljs-type">i32</span>[N];   data b : <span class="hljs-type">i32</span>[N];   data c : <span class="hljs-type">i32</span>[N];
kernel add        : (<span class="hljs-type">i32</span>, <span class="hljs-type">i32</span>) <span class="hljs-punctuation">-&gt;</span> <span class="hljs-type">i32</span>   pure;
kernel load_input : ()         <span class="hljs-punctuation">-&gt;</span> <span class="hljs-type">i32</span>[N] effectful;
a &lt;-- <span class="hljs-title function_ invoke__">load_input</span>();
b &lt;-- <span class="hljs-title function_ invoke__">load_input_b</span>();
<span class="hljs-keyword">for</span> <span class="hljs-title class_">i</span> : <span class="hljs-number">0</span> .. N {
    c[i] &lt;-- <span class="hljs-title function_ invoke__">add</span>(a[i], b[i]);
}
<span class="hljs-title function_ invoke__">save_output</span>(c);
</code></pre>
<p><em>Pure</em> kernels reorder &amp; dedup; <em>effectful</em> kernels keep ordering.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="nucleus" lang="en-DK" data-marpit-pagination="9" style="--paginate:true;--theme:nucleus;" data-marpit-pagination-total="21" data-size="16:9">
<h2 id="and-the-schedule-decides-the-target">…and the schedule decides the target</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-rust"><span class="hljs-comment">// naive.sched.nuc — everything on one worker</span>
schedule <span class="hljs-keyword">for</span> <span class="hljs-string">&quot;../prog.algo.nuc&quot;</span> {
    workers = { host };
    place add on host;
    <span class="hljs-comment">// no transfers: no cross-worker edges</span>
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-rust"><span class="hljs-comment">// 07-matmul distributed — same algorithm, 4 workers</span>
workers = { host, w0, w1, w2, w3 };
place madd on { w0, w1, w2, w3 };
<span class="hljs-keyword">loop</span> i   : partition=workers;
transfer a : sync;  transfer b : sync;  transfer c : sync;
</code></pre>
<blockquote>
<p>Swap the file → host-only smoke test becomes a 4-worker distributed run.</p>
</blockquote>
</section>

<h2 id="what-each-pass-injects">What each pass injects</h2>
<ul>
<li><strong><code>block_transform</code></strong> — strip-mines <code>block=N</code> loops into tile + inner nest.</li>
<li><strong>partition × 3</strong> — <code>workers</code>, <code>rows</code> (2D band), <code>blocks2d</code> (2D grid).</li>
<li><strong>halo / reuse inference</strong> — write sidecars for stencil overlap &amp; loop-carried slices.</li>
<li><strong><code>sync_inject</code></strong> — barriers at cross-worker joins; elides &lt;2-participant Syncs.</li>
<li><strong><code>transfer_inject</code></strong> — matched <code>Push</code>/<code>Wait</code> pairs per cross-worker edge.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">1. Sequence: prev writes W1, next reads W2, W1≠W2 → Sync{W1∪W2}
2. Repeat entry/exit: body workers differ → prepend / append Sync
4. Elision: a Sync with &lt; 2 participants is never emitted
</code></pre>
</section>

<h2 id="a-stall-is-a-compile-error">A stall is a compile error</h2>
<p><code>check_net_sound</code> runs on <strong>every build</strong> — boundedness then deadlock, over one derived firing order:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-rust"><span class="hljs-keyword">pub</span> <span class="hljs-keyword">fn</span> <span class="hljs-title function_">check_net_sound</span>(net: &amp;Net) <span class="hljs-punctuation">-&gt;</span> <span class="hljs-type">Result</span>&lt;(), PetriAnalysisError&gt; {
    <span class="hljs-keyword">let</span> <span class="hljs-variable">order</span> = <span class="hljs-title function_ invoke__">derive_firing_order</span>(net);
    <span class="hljs-title function_ invoke__">check_bounded</span>(net, &amp;order)?;            <span class="hljs-comment">// capacity overflow → error</span>
    <span class="hljs-title function_ invoke__">check_deadlock_free</span>(net, &amp;order)?;      <span class="hljs-comment">// reachable stall  → error</span>
    <span class="hljs-title function_ invoke__">Ok</span>(())
}
</code></pre>
<p>Because v2 <strong>fixes the firing order at compile time</strong>, both properties fall out of a single deterministic replay — sound for this restricted net class (not general model checking).</p>
</section>

<ul>
<li>The per-worker <strong>EventList</strong> (<code>Fire</code>/<code>Push</code>/<code>Wait</code>/<code>Sync</code>/<code>Loop</code>) is the <em>sole</em> codegen contract — structure-preserving (rolled loops stay rolled).</li>
<li>All <strong>7 tier-1 backends emit bit-identical output</strong> — the differential oracle.</li>
</ul>
</section>

<h2 id="one-contract-many-transports">One contract, many transports</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-rust"><span class="hljs-keyword">enum</span> <span class="hljs-title class_">Event</span> {
    Fire  { kernel, tile, bindings },
    Push  { dst, data, tile, seq },     <span class="hljs-comment">// pair on a shared SeqTag</span>
    Wait  { src, data, tile, seq },
    <span class="hljs-built_in">Sync</span>  { participants, kind, sync },  <span class="hljs-comment">// share a SyncTag</span>
    Loop  { iter_var, range, body, .. }, <span class="hljs-comment">// never unrolled</span>
}
</code></pre>
<blockquote>
<p>One <code>Push</code> is a <code>memcpy</code> (openmp-rs), a <code>socket.write</code> (mp-tcp-event), an <code>MPI_Isend</code> (mpi-nonblocking), or a DMA enqueue (embedded). <code>capabilities.toml</code> is the committable per-backend contract; codegen <strong>fails fast</strong> on mismatch.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="nucleus" lang="en-DK" data-marpit-pagination="17" style="--paginate:true;--theme:nucleus;" data-marpit-pagination-total="21" data-size="16:9">
<h2 id="deep-dive--matmul-across-4-workers">Deep dive — matmul across 4 workers</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-rust"><span class="hljs-keyword">for</span> <span class="hljs-title class_">i</span> : <span class="hljs-number">0</span>..N { <span class="hljs-keyword">for</span> <span class="hljs-title class_">j</span> : <span class="hljs-number">0</span>..N { <span class="hljs-keyword">for</span> <span class="hljs-title class_">k</span> : <span class="hljs-number">0</span>..N {
    c[i][j] &lt;-- <span class="hljs-title function_ invoke__">madd</span>(c[i][j], a[i][k], b[k][j]);
}}}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-rust">place madd on { w0, w1, w2, w3 };
<span class="hljs-keyword">loop</span> i : partition=workers;          <span class="hljs-comment">// each worker owns an i-band</span>
transfer a : sync;  transfer b : sync;  transfer c : sync;
</code></pre>
<ul>
<li><code>partition_workers</code> rewrites the <code>i</code> range per worker (array_split remainder policy).</li>
<li><code>transfer_inject</code> synthesises host→worker <code>Push</code>/<code>Wait</code>; host <strong>gathers</strong> the bands back into <code>c</code> — bit-identical to the reference.</li>
</ul>
</section>
