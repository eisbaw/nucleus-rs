# Nucleus v2 — CI verification gate. TASK-0057.
#
# Single source of truth: every job runs `nix develop -c just <step>`,
# and the full gate is exactly `just ci`. "What CI does" == "what a
# developer runs locally" by construction — the workflow does not
# re-implement the gate, it delegates to the justfile (see justfile
# `ci` recipe and its TASK-0162 note).
#
# Reproducibility (PRD §1 / §10.1) is a first-class gate, not an
# afterthought: determinism-check and determinism-check-negative are
# CI jobs alongside check/clippy/test/e2e. determinism-check-negative
# is the falsifier — it passes iff the determinism harness correctly
# DETECTS injected nondeterminism, so a green determinism-check is
# only trustworthy because the negative arm is also green.
#
# Milestone matrix (TASK-0167, AC#3/#4 — GENUINE, not cosmetic). The
# `milestone` job below is a real matrix: each entry runs
# `just e2e-milestone M<k>`, which the e2e harness narrows to the
# CUMULATIVE required set tagged at or before M<k> (see
# nuc-nucleus/e2e-matrix.toml per-cell `milestone` key). The jobs run
# DIFFERENT required sets — at the time of writing 4 (M1) / 8 (M2) /
# 24 (M3) REQUIRED cells (M3 executes 28 total = 24 pass + 4 skipped)
# — so this is a data dimension that changes behaviour,
# not the 7-identical-jobs decoration the architect rejected in the
# original TASK-0057 cycle (commit 6d7fcf7 collapsed that). The
# separate `gate` job remains the single full-trust tier-1 gate
# (`just ci`); the milestone matrix is the per-tier early-signal /
# milestone-branch gate. Both delegate to the justfile (CI == local).
#
# PR-to-milestone-branch (AC#4): a PR targeting `milestone/M<k>` runs
# that tier — the `milestone` job's matrix covers M1..M3 on every PR
# and push, so a milestone branch's PR is gated by (at least) its
# tier; `just e2e-milestone M<k>` is the exact command to reproduce a
# given tier locally. Tier-2/3 (MPI M7+, Renode M9+) remain disabled
# placeholders below — backends/runtimes do not exist yet.
#
# Limitations recorded in TASK-0057 notes (AC#6/#7): runner choice
# (GitHub-hosted vs self-hosted) and Nix/Cargo cache strategy/cost;
# branch-protection / merge-block cannot be configured from the repo
# and must be set in GitHub repo settings by a maintainer; this
# repo currently has no remote, so this workflow has NOT been
# observed on a real runner.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  # Milestone branches: PRs targeting a milestone branch get the same
  # tier-1 gate today. When tier-2/3 land, the matrix `include` rows
  # below switch the extra tiers on for the relevant milestones.
  workflow_dispatch:

# A failing job fails the workflow (AC#2): GitHub Actions marks the
# workflow run failed if any job exits non-zero, and required status
# checks then block merge once branch protection is configured on the
# repo (maintainer action — see TASK-0057 notes / TASK-0166).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The single full-trust tier-1 gate: the entire `just ci` aggregate
  # (check/clippy/test/e2e/determinism). This is the byte-for-byte
  # "what a developer runs locally" gate and is the authoritative
  # merge-blocking check. It runs the FULL e2e matrix (bare `just
  # e2e`), unaffected by the milestone work.
  #
  # Future tiers (deliberately disabled, not stubbed): tier-2 MPI CI
  # is TASK-0164 (lands with M7), tier-3 Renode is TASK-0165 (M9+).
  # The backends/runtimes do not exist yet; enabling a row now would
  # be a job that fails or fakes success — both forbidden. When
  # enabled they must run a tier-appropriate recipe
  # (compile-mandatory / run-best-effort per PRD §10.2/§10.3), NOT
  # `just ci`.
  gate:
    name: tier-1 gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nix is the reproducibility substrate (PRD §12.1). The flake
      # pins the Rust toolchain; CI must use the SAME shell a
      # developer uses, so every gate step is `nix develop -c ...`.
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Cache the Nix store so the pinned toolchain + flake inputs are
      # not re-fetched/rebuilt every run. See TASK-0057 notes for the
      # cost trade-off (free GitHub-hosted runner + magic-nix-cache vs
      # self-hosted persistent store).
      - name: Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      # Cargo build/registry cache, keyed on the lockfile so a
      # dependency change invalidates cleanly. nucleus/target is the
      # workspace target dir (justfile `cd nucleus && cargo ...`).
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nucleus/target
          key: cargo-${{ runner.os }}-${{ hashFiles('nucleus/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # The whole gate, delegated to the justfile. One command so CI
      # and local cannot drift. Exits non-zero on the first failing
      # step (just is fail-fast), which fails the job and the
      # workflow (AC#2). Covers AC#1 (check/clippy/test/e2e) plus the
      # reproducibility gates.
      - name: just ci (tier-1 full gate)
        run: nix develop -c just ci

  # GENUINE per-milestone matrix (TASK-0167 AC#3/#4). Each entry runs
  # `just e2e-milestone M<k>`, which the harness narrows to the
  # CUMULATIVE required set for that tier — the jobs run DIFFERENT
  # required sets (M1 ⊂ M2 ⊂ M3; today 4 / 8 / 24 required cells; M3
  # executes 28 total incl. 4 skipped), so this is
  # a real data dimension, NOT the 7-identical-jobs decoration the
  # architect rejected. fail-fast:false so every tier reports even if
  # an earlier tier fails (a per-tier signal is the point). Delegates
  # to the justfile, so CI == local: reproduce any tier with
  # `nix develop -c just e2e-milestone M<k>`.
  milestone:
    name: e2e tier ${{ matrix.milestone }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        milestone: [M1, M2, M3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nucleus/target
          key: cargo-${{ runner.os }}-${{ hashFiles('nucleus/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # The per-tier required set. A PR to a milestone branch is gated
      # by (at minimum) its tier; this command reproduces it locally
      # verbatim. Exits non-zero on any required-cell failure or a
      # TASK-0163 coverage gap WITHIN that tier (the coverage guard is
      # scoped by the SAME cumulative predicate, so a typo'd/stale
      # milestone-tagged required cell still hard-fails its tier).
      - name: just e2e-milestone ${{ matrix.milestone }}
        run: nix develop -c just e2e-milestone ${{ matrix.milestone }}
