# Nucleus v2 — CI verification gate. TASK-0057.
#
# Single source of truth: every job runs `nix develop -c just <step>`,
# and the full gate is exactly `just ci`. "What CI does" == "what a
# developer runs locally" by construction — the workflow does not
# re-implement the gate, it delegates to the justfile (see justfile
# `ci` recipe and its TASK-0162 note).
#
# Reproducibility (PRD §1 / §10.1) is a first-class gate, not an
# afterthought: determinism-check and determinism-check-negative are
# CI jobs alongside check/clippy/test/e2e. determinism-check-negative
# is the falsifier — it passes iff the determinism harness correctly
# DETECTS injected nondeterminism, so a green determinism-check is
# only trustworthy because the negative arm is also green.
#
# Milestone matrix (AC#3): `tier` is parameterised by milestone. At
# M0–M6 the only active tier is tier-1 (the `just ci` gate). Tier-2
# (MPI, M7+) and tier-3 (Renode, M9+) rows are declared but disabled
# until those backends and runtimes exist — see the commented matrix
# entries and TASK follow-ups below. Disabled rows are honest
# placeholders, NOT silently-passing stubs.
#
# Limitations recorded in TASK-0057 notes (AC#6/#7): runner choice
# (GitHub-hosted vs self-hosted) and Nix/Cargo cache strategy/cost;
# branch-protection / merge-block cannot be configured from the repo
# and must be set in GitHub repo settings by a maintainer; this
# repo currently has no remote, so this workflow has NOT been
# observed on a real runner.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  # Milestone branches: PRs targeting a milestone branch get the same
  # tier-1 gate today. When tier-2/3 land, the matrix `include` rows
  # below switch the extra tiers on for the relevant milestones.
  workflow_dispatch:

# A failing job fails the workflow (AC#2): GitHub Actions marks the
# workflow run failed if any job exits non-zero, and required status
# checks then block merge once branch protection is configured on the
# repo (maintainer action — see TASK-0057 notes / TASK-0166).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A SINGLE honest tier-1 gate job. There is deliberately NO
  # milestone matrix: today every milestone M0–M6 would run the
  # byte-identical `just ci` gate (the e2e harness's `--milestone`
  # flag is accepted-but-ignored and nuc-nucleus/e2e-matrix.toml has
  # no milestone dimension — verified in nucleus/e2e/src/main.rs).
  # A 7-cell fan-out keyed on a value that changes no behaviour would
  # be cosmetic config burning 7x CI minutes while pretending to be a
  # data dimension — rejected (mped-architect review of TASK-0057;
  # the original cycle wrongly checked AC#3 on this decorative
  # matrix). Genuine per-milestone parameterisation requires wiring
  # `--milestone` through `just ci` -> the e2e harness AND adding a
  # milestone key to e2e-matrix.toml so the required set actually
  # differs per milestone: that real work is TASK-0167. Until it
  # lands, AC#3 is honestly UNMET, not faked with scaffolding.
  #
  # Future tiers (deliberately disabled, not stubbed): tier-2 MPI CI
  # is TASK-0164 (lands with M7), tier-3 Renode is TASK-0165 (M10).
  # The backends/runtimes do not exist yet; enabling a row now would
  # be a job that fails or fakes success — both forbidden. When
  # enabled they must run a tier-appropriate recipe
  # (compile-mandatory / run-best-effort per PRD §10.2/§10.3), NOT
  # `just ci`.
  gate:
    name: tier-1 gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nix is the reproducibility substrate (PRD §12.1). The flake
      # pins the Rust toolchain; CI must use the SAME shell a
      # developer uses, so every gate step is `nix develop -c ...`.
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Cache the Nix store so the pinned toolchain + flake inputs are
      # not re-fetched/rebuilt every run. See TASK-0057 notes for the
      # cost trade-off (free GitHub-hosted runner + magic-nix-cache vs
      # self-hosted persistent store).
      - name: Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      # Cargo build/registry cache, keyed on the lockfile so a
      # dependency change invalidates cleanly. nucleus/target is the
      # workspace target dir (justfile `cd nucleus && cargo ...`).
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nucleus/target
          key: cargo-${{ runner.os }}-${{ hashFiles('nucleus/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # The whole gate, delegated to the justfile. One command so CI
      # and local cannot drift. Exits non-zero on the first failing
      # step (just is fail-fast), which fails the job and the
      # workflow (AC#2). Covers AC#1 (check/clippy/test/e2e) plus the
      # reproducibility gates.
      - name: just ci (tier-1 full gate)
        run: nix develop -c just ci
