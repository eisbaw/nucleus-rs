# Nucleus v2 — CI gate. TASK-0057.
#
# GitHub CI runs the individual fine-grained recipes as PARALLEL jobs so
# a red check names the exact recipe that regressed. It deliberately
# does NOT run the `just ci` convenience aggregate (that would duplicate
# the individual recipes), and it does NOT run the cross-backend e2e
# matrix (`just e2e` / `e2e-milestone` and the determinism / xbackend /
# required-coverage arms, all of which drive the full matrix through the
# `nucleus-e2e` harness) — those are disk- and time-heavy and run
# locally or on a dedicated runner. `just ci` remains the full local
# gate; CI is a fine-grained subset of it, minus the e2e matrix.
#
# Tier-3 Renode and the nightly mp-tcp port-stress stay as separate
# best-effort jobs (unchanged).

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nucleus/target
          key: cargo-${{ runner.os }}-${{ hashFiles('nucleus/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - run: nix develop -c just check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nucleus/target
          key: cargo-${{ runner.os }}-${{ hashFiles('nucleus/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - run: nix develop -c just clippy

  test:
    name: test (dev profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nucleus/target
          key: cargo-${{ runner.os }}-${{ hashFiles('nucleus/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - run: nix develop -c just test

  test-release:
    name: test (release profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nucleus/target
          key: cargo-${{ runner.os }}-${{ hashFiles('nucleus/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - run: nix develop -c just test-release

  # Cheap structural + doc-honesty fences. Each is its own step so a red
  # one names the exact fence; they share a job because none needs a
  # cargo build (grep/rg over source), so per-fence jobs would only pay
  # redundant Nix-install setup.
  fences:
    name: structural + doc fences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@v8
      - run: nix develop -c just check-textual-replace-on-codegen
      - run: nix develop -c just check-include-str-coverage
      - run: nix develop -c just check-reference-independence
      - run: nix develop -c just check-reference-independence-negative
      - run: nix develop -c just check-narrative-doc-lie
      - run: nix develop -c just check-doc-citation-staleness
      - run: nix develop -c just check-doc-citation-staleness-bare
      - run: nix develop -c just check-doc-test-name-staleness
      - run: nix develop -c just check-doc-cell-path-staleness
      - run: nix develop -c just check-mega-files
      - run: nix develop -c just check-readme-counts
      - run: nix develop -c just check-doc-links

  # Nightly mp-tcp-bufsync port-handshake stress (TASK-0252 / TASK-0176
  # AC#2): 20 parallel `nucleus-e2e --backend mp-tcp-bufsync` runs, fail
  # loud on any flake. Scoped to schedule + manual dispatch (too heavy
  # for per-PR walltime). Reproduce: `nix develop -c just port-stress-check`.
  port-stress:
    name: nightly port-stress (mp-tcp-bufsync, 20x parallel)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nucleus/target
          key: cargo-${{ runner.os }}-${{ hashFiles('nucleus/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - run: nix develop -c just port-stress-check

  # Tier-3 Renode multi-MCU value-correctness gate (TASK-0049.10.08 /
  # TASK-0165): two STM32H7 co-sims (02-split-add 2-MCU + 14-hearing-aid
  # 3-MCU), each byte-exact vs reference.bin. Enters `.#embedded` +
  # `.#renode` internally (~1-2GB closure), so it is scoped to
  # push-to-main/master + schedule + manual dispatch, not per-PR.
  # Reproduce: `nix develop -c just renode-multimcu-gate`.
  renode-multimcu:
    name: tier-3 Renode multi-MCU value-correctness
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nucleus/target
          key: cargo-${{ runner.os }}-${{ hashFiles('nucleus/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - run: nix develop -c just renode-multimcu-gate
