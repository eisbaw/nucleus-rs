# pthreads-async backend crate (SKELETON). See PRD §7.1, TASK-0042.01.
#
# Tier-1 CPU backend: std::thread + std::sync::Condvar + bounded ring
# buffer per (DataId, SeqTag). supports_async=true, supports_buffer=true
# — the THIRD tier-1 backend, providing the buffered/pipelined surface
# that the two sync tier-1 backends (pthreads-sync, mp-tcp-bufsync)
# cannot. Same workspace shape as pthreads-sync (shared memory, single
# binary, copy-of-kernels.rs).
#
# ## Current status: SKELETON (TASK-0042.01 cycle 16, 2026-05-21)
#
# The crate, capabilities.toml, public `emit(...)` entry point,
# workspace registration, and driver dispatch arm are wired through.
# The actual codegen body (ring buffer + Condvar + check_frame
# integration) is NOT in this cycle — it is the subject of follow-up
# sub-tasks TASK-0226 / 0227 / 0228 / 0229 that depend on this
# foundation. `emit()` returns `EmitError::ContractGap` until then.

[package]
name = "pthreads-async"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "pthreads_async"
path = "src/lib.rs"

[dependencies]
# Post-TASK-0124 the backend consumes only the per-worker EventList +
# NameSidecar + inert expr grammar from `compiler`. No parser / lower /
# link / acfg internals.
compiler = { path = "../../compiler" }
# Shared codegen primitives (TASK-0244 cycle 37 + TASK-0246 cycle 38):
# RenderCtx, the expression / index / kernel-call / loop-bound / type
# renderers, the check_frame emit templates, the multi-worker event
# walker (the centrepiece TASK-0239 lifted; pthreads-async's multi-
# worker Plan parameterises the SAME walker with `"ring"` instead of
# `"slot"`), AND the single-binary project-skeleton renderers
# (`render_cargo_toml` / `render_run_sh`, moved out of pthreads-sync
# in cycle 38). This is the single source of truth that prevents
# renderer drift across the three tier-1 backends.
backend-common = { path = "../../backend-common" }
# pthreads-sync provides `render_single_worker_main` — the pthreads-
# sync-specific straight-line main.rs emitter. pthreads-async
# DELEGATES to it for the 0/1-used-worker case (TASK-0226), giving
# byte-identical single-worker emit. This is the ONE semantic inter-
# backend arrow that survives TASK-0244 + TASK-0246: the project-
# skeleton renderers (Cargo.toml + run.sh) moved to backend-common in
# cycle 38, leaving only the straight-line emitter as a genuinely
# pthreads-sync-owned surface that pthreads-async (and mp-tcp-bufsync's
# single-process arm) delegate to.
pthreads-sync = { path = "../pthreads-sync" }

[dev-dependencies]
# Shared lower-link-inject pipeline boilerplate (TASK-0237) — used by
# tests/skeleton.rs's lower_example_01_naive helper since cycle 24.
test-common = { path = "../../test-common" }
