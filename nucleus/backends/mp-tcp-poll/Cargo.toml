# mp-tcp-poll backend crate. See PRD §7.1, TASK-0044.02.
#
# Tier-1 backend: workers are OS PROCESSES, transport is TCP loopback,
# notify is NONBLOCKING POLL (busy/yield wait loop), no buffer, sync.
# Same SCHEDULE-visible capability surface as mp-tcp-bufsync (sync only,
# single-frame, barrier/blocking/poll notify) — the cross-backend
# differential gains a SECOND sync-TCP row. Differs from mp-tcp-bufsync
# only in the wait primitive: where bufsync calls blocking
# `wire::read_msg_expect`, poll calls a nonblocking-read loop with
# `std::thread::yield_now`.
#
# ## Current status: SINGLE-WORKER LANDED (TASK-0044.02 cycle 192)
#
# Crate + capabilities.toml + driver dispatch arm + workspace member
# wired through. `emit()` dispatches on `used_workers.len()`:
#   - `<= 1`: delegates to `backend_common::single_worker_main::render_single_worker_main_with_kernels_attr`
#     + `backend_common::project_skeleton::multi_binary::{render_cargo_toml,
#     render_run_sh_single}` (same path mp-tcp-bufsync's single-process
#     arm takes); the emitted artefact is BYTE-IDENTICAL to mp-tcp-bufsync's
#     single-process output (and therefore byte-identical arithmetic to
#     pthreads-sync's single process).
#   - `>= 2`: returns `EmitError::ContractGap` forward-linking
#     TASK-0044.02.02 (nonblocking-poll multi-worker codegen pending).
#
# `mp-tcp-common` provides wire framing reused by mp-tcp-bufsync +
# mp-tcp-event; pthreads-sync provides the single-worker delegation —
# the same precedent mp-tcp-bufsync + mp-tcp-event + pthreads-async use.

[package]
name = "mp-tcp-poll"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mp_tcp_poll"
path = "src/lib.rs"

[dependencies]
nucleus-compiler = { path = "../../nucleus-compiler" }
# Shared codegen primitives — EmitError + project_skeleton::multi_binary
# (Cargo.toml + run.sh templates for multi-binary backends).
backend-common = { path = "../../backend-common" }
# Wire framing (length-prefixed framed messages over TCP, SyncTag-keyed
# barrier protocol). Same wire-v0 mp-tcp-bufsync + mp-tcp-event emit
# verbatim — single source of truth at `mp_tcp_common::WIRE_RUNTIME_SRC`.
mp-tcp-common = { path = "../../mp-tcp-common" }

[dev-dependencies]
# Shared lower-link-inject pipeline boilerplate (TASK-0237) — used by
# tests/single_worker_emit.rs to lower a real example and assert
# byte-identical emit against mp-tcp-bufsync.
test-common = { path = "../../test-common" }
# pthreads-sync is now a TEST-ONLY (oracle) dependency. The shared
# single-worker renderer (`render_single_worker_main_with_kernels_attr`)
# was relocated to `backend_common::single_worker_main` in TASK-0455.11
# — the last inter-backend PRODUCTION arrow — so the `src/` no longer
# touches it. tests/pingpong.rs still emits via `pthreads_sync::emit` as
# the byte-identical single-worker oracle and spells
# `pthreads_sync::NameTables`; that oracle wiring stays as a
# dev-dependency.
pthreads-sync = { path = "../pthreads-sync" }
# mp-tcp-bufsync is the byte-identical-emit oracle for mp-tcp-poll's
# single-process arm (both backends consume the same shared renderers;
# their emitted artefacts MUST be byte-identical for any single-worker
# schedule). Dev-only — no production-code dependency between the two
# backend crates.
mp-tcp-bufsync = { path = "../mp-tcp-bufsync" }
