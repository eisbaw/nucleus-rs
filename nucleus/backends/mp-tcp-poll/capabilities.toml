# capabilities.toml for the mp-tcp-poll backend.
# Schema: docs/capabilities-toml.md (TASK-0019).
# PRD §7.1 row 5: tier-1 backend, OS processes over TCP loopback,
# nonblocking-poll wait primitive, no buffer, sync.
#
# Same SCHEDULE-visible capability surface as mp-tcp-bufsync (sync only,
# no buffer>1, barrier/blocking notify) so the IDENTICAL schedule
# compiles under BOTH. The cross-backend differential gains a second
# sync-TCP row; the only material differential is the wait primitive
# (`poll` here; barrier/blocking lifted from mp-tcp-bufsync's actual
# cap-file for the schema-compat sibling guarantee).
#
# `poll` is the cycle-171 architect-P2.3 schema variant that cycle-172
# verified the existing NotifyMode enum (nucleus-compiler/src/
# capabilities.rs:91) and the docs schema (docs/capabilities-toml.md:68)
# already accept end-to-end. No schema work needed for this row.

schema_version  = 1
name            = "mp-tcp-poll"
tier            = 1
transport       = "tcp"
notify          = ["poll", "barrier", "blocking"]
supports_async  = false
supports_buffer = false
max_buffer      = 1
worker_classes  = ["default"]
memory_regions  = ["heap"]

# Topology/mediation flags (TASK-0455.09; docs/capabilities-toml.md).
# Same TCP STAR topology as mp-tcp-bufsync: host-excluding barriers need
# host mediation (apply_host_mediation_inject). Nonblocking-poll over the
# same per-pair-FIFO stream — safe-push-reorder is UNSAFE (host's own w2w
# Waits would race a moved relay). Only the mediation flag is set.
star_topology_host_mediation = true
host_data_relay              = false
reorderable_push             = false
