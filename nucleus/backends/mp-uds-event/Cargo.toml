# mp-uds-event backend crate (SKELETON). See PRD §7.1, TASK-0044.03.
#
# Tier-1 backend: workers are OS PROCESSES, transport is Unix domain
# sockets, notify is mio/epoll event readiness, supports async + buffer
# (per-(DataId, SeqTag) bounded queue). Same SCHEDULE-visible capability
# surface as mp-tcp-event (async + buffered + event notify); the
# cross-backend differential gains a FOURTH async+buffered+event row
# (alongside pthreads-async + mp-tcp-event), and the FIRST UDS row.
# Differs from mp-tcp-event only in the transport layer (Unix domain
# sockets via mio's UnixListener / UnixStream instead of TCP loopback).
#
# ## Current status: SKELETON (TASK-0044.03 cycle 175, 2026-05-26)
#
# Crate + capabilities.toml + driver dispatch arm + workspace member
# wired through. `emit()` returns `EmitError::ContractGap` for ALL inputs
# (single- and multi-worker) until the substantive codegen lands. The
# capability-compat check IS real — schedules that compile against
# mp-tcp-event compat-check cleanly against mp-uds-event; the subsequent
# codegen call surfaces the skeleton via the typed ContractGap
# forward-link.
#
# No `mio` / `mp-tcp-common` / `pthreads-sync` deps yet — added when
# substantive codegen lands. The cycle-171 brief flags this as a
# CANDIDATE FOR LIFTING (assess mp-tcp-event's reactor parametricity
# before copying); the skeleton cycle defers that decision to the
# codegen cycle.

