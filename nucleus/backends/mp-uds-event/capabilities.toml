# capabilities.toml for the mp-uds-event backend.
# Schema: docs/capabilities-toml.md (TASK-0019).
# PRD §7.1 row 7: tier-1 backend, OS processes over Unix domain sockets,
# mio/epoll event-readiness notify, async + buffered.
#
# Same SCHEDULE-visible capability surface as mp-tcp-event (async + buffer
# + event notify) so the IDENTICAL schedule compiles under BOTH. The
# cross-backend differential gains a fourth async+buffered+event row
# (alongside pthreads-async + mp-tcp-event); the only material
# differential is `transport = "uds"`.

schema_version  = 1
name            = "mp-uds-event"
tier            = 1
transport       = "uds"
notify          = ["event"]
supports_async  = true
supports_buffer = true
max_buffer      = 64
worker_classes  = ["default"]
memory_regions  = ["heap"]

# Topology/mediation flags (TASK-0455.09; docs/capabilities-toml.md).
# UDS STAR topology, structurally identical to mp-tcp-event (one CTRL
# stream per (host,worker) over UnixStream): mediation needed for host-
# excluding barriers, no native w2w DATA channel (host relay), per-(seq)
# DEMUX inbound queue (safe-push hoist sound). All three flags set.
star_topology_host_mediation = true
host_data_relay              = true
reorderable_push             = true
