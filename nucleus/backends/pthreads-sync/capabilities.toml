# capabilities.toml for the pthreads-sync backend.
# Schema: docs/capabilities-toml.md (TASK-0019).
# PRD §7.1: tier-1 CPU backend, std::thread + std::sync::Condvar,
# shared memory, sync only.

schema_version  = 1
name            = "pthreads-sync"
tier            = 1
transport       = "shared-memory"
notify          = ["barrier", "blocking"]
supports_async  = false
supports_buffer = false
max_buffer      = 1
worker_classes  = ["default"]
memory_regions  = ["heap"]

# Topology/mediation flags (TASK-0455.09; docs/capabilities-toml.md).
# Shared-memory `std::sync::Barrier` on an Arc handles host-excluding
# barriers natively, and worker-to-worker data rides direct shared-memory
# channels — so NONE of the host-mediation passes apply. All three false.
star_topology_host_mediation = false
host_data_relay              = false
reorderable_push             = false
