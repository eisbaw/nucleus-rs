# pthreads-sync backend crate. See PRD §7.1, TASK-0020.
#
# Tier-1 CPU backend that emits std::thread + std::sync::Condvar Rust
# from the post-injection ACFG plus LinkedIR. Sync only, shared memory.
#
# At M1 only the single-worker naive path is exercised end-to-end.
# Multi-worker codegen is structurally accommodated (per PRD §7.1's
# capability declaration) but not validated until later tasks land
# example 2 (split add).

[package]
name = "pthreads-sync"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "pthreads_sync"
path = "src/lib.rs"

[dependencies]
# Post-TASK-0124 the backend is AlgoIR/LinkedIR/ACFG-free: it consumes
# only the per-worker EventList (nucleus_compiler::event), the
# NameSidecar (nucleus_compiler::sidecar), and the inert
# expr-grammar/scalar types
# (nucleus_compiler::algo::{IrExpr,IrBinOp,ResolvedType,ScalarType})
# that those contract types themselves carry. The dep remains for
# those modules only — no parser/lower/link/acfg internals.
nucleus-compiler = { path = "../../nucleus-compiler" }
# Shared codegen primitives (TASK-0244 cycle 37): RenderCtx, the
# expression/index/kernel-call/loop-bound/type renderers, the
# check_frame emit templates, and the multi-worker event walker.
# Lifted out of THIS crate by cycle 37 — pthreads-sync is now a
# consumer of backend-common like the other backends.
backend-common = { path = "../../backend-common" }

[dev-dependencies]
# Shared lower-link-inject pipeline boilerplate (TASK-0237). Refactored
# tests/multi_worker.rs's lower_multi_worker_check_schedule to call
# test_common::lower_for_test in cycle 24.
test-common = { path = "../../test-common" }
