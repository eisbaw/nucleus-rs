# capabilities.toml for the embedded-pattern backend (tier 3, M9).
# Schema: docs/capabilities-toml.md (TASK-0019). PRD §7.3 / §7.4 / §11.
#
# This is the GENERIC tier-3 backend's M9/M11-slice-A capability
# surface. It is deliberately MINIMAL — exactly the demands the
# example 1 + example 5 `naive` schedules make (`default` worker class;
# sync; no async; no buffer>1; heap region). That minimality is the
# point: prove the no_std event-list lowering + stub-shim compile path
# end-to-end on the smallest representative schedules before a shim adds
# real hardware capability.
#
# ## Multi-worker is now lowered on the LIB path (TASK-0049.04), but the
# ## capability VALUES below are unchanged and still load-bearing.
#
# As of TASK-0049.04 (M11 backend slice A) the LIB emit path
# (`--backend embedded-pattern` with no `--shim`) lowers a MULTI-worker
# schedule (one no_std lib per worker, Push/Wait/Sync -> stub-shim
# hooks). That does NOT change this file: a multi-worker schedule over
# the `default` class with `sync` transfers (e.g.
# 02-split-add/split.sched.nuc) already satisfied these capabilities and
# now reaches the multi-worker emit. The values stay MINIMAL precisely
# so the heterogeneous real example-14 `embedded_multimcu` schedule
# (worker classes fe_core/dsp_core/rf_core + async + buffer=3 +
# notify=event + sram_shared/dsp_tcm regions) is STILL correctly
# rejected at this gate — admitting those would be a LIE against the
# synchronous stub shim. The synchronous-vs-async transport decision +
# the heterogeneous worker classes (plus no_std-clean per-frame kernel
# bodies) are filed as TASK-0049.06 (real-ex14 LIB cross-compile
# follow-up) and TASK-0049.05 (the BIN slice); do NOT widen these to
# make ex14 pass without making that decision.
#
# ## ASYNC + DOUBLE-BUFFERED + IRQ-EVENT NOTIFY now declared (TASK-0455.02)
#
# PRD §7.3 row `embedded-cortexm-dma-irq` advertises IRQ + completion
# notify, descriptor-ring buffering, and async semantics — the headline
# "IO semantics as swappable schedule directives" contribution, which
# matters MOST on bare metal (no OS to absorb latency; the 2013 ISP-
# firmware double-buffered DMA pipelines). TASK-0455.02 lands that on the
# DMA-mode (`mode=dma`) transport path:
#   * `supports_async = true`  — an `async` transfer no longer rejects;
#     the DMA-mode Push arms a descriptor and the matched Wait completes
#     it, so the producer is not blocked at the arm site.
#   * `supports_buffer = true`, `max_buffer = 2` — a DMA-mode transfer
#     crossing INSIDE a `loop V : pipeline=2` body renders a DEPTH-2
#     descriptor ring (split-phase: arm iteration i+1 while i is in
#     flight); the renderer carries the double-buffering as software
#     pipelining in the loop body (no new Event variant — TASK-0455.02
#     finding 1). `max_buffer = 2` is the HONEST cap: the modelled shim
#     tracks a two-slot ring, so `buffer=3..` (e.g. ex9's `buffer=4`)
#     STILL rejects loudly with `BufferTooLarge` — deeper rings are
#     follow-up work, not a capability lie.
#   * `notify = ["event", "poll", "barrier", "blocking"]` — `notify=event`
#     and `notify=poll` (the two schedule-surface notify modes, PRD §6.3.4)
#     now both accepted. The renderer honours `event` ONLY on the
#     depth-2 RING path (`mode=dma` + `buffer>=2`): IRQ-driven completion
#     via `dma_link_irq_wait` (a poll-spin default on the modelled
#     DMA-complete event). On a single-buffer DMA edge a `notify=event`
#     request passes the capability gate but renders the same
#     `dma_link_poll` busy-spin (behaviourally identical today since the
#     irq-wait default IS a spin — wave-6 review P3.7). `poll`/absent
#     always uses `dma_link_poll`. Declaring BOTH keeps the cap surface
#     consistent with what `render_completion_wait` actually emits (a
#     `notify=poll` DMA edge must NOT reject when the backend genuinely
#     supports the poll completion). The two legacy modes
#     (`barrier`/`blocking`) stay so the existing sync barrier
#     (`irq_barrier`) + blocking-recv paths are unchanged.
#
# SCOPE LIMITS (honest, NOT a capability lie):
#   * Double-buffering applies ONLY on the `mode=dma` transport path. A
#     PIO (`mode=pio` / absent) transfer ignores `buffer`/`notify` and
#     renders the unchanged blocking byte-loop — there is no ring there.
#   * `max_buffer = 2` only. Depth >2 rings (and the `notify=irq` doorbell
#     variant) are NOT claimed.
#   * Single-worker (no `--shim`) and multi-MCU (`--shim stm32h7` /
#     `nrf52840`) all share the SAME `run<S>` lowering, so the ring emit is
#     family-agnostic; the concrete ring/IRQ-wait shim methods have a
#     DEFAULT impl (delegating to the existing modelled-DMA hooks), so no
#     per-family churn and StubShim stays compile-only-honest.
#
# `transport = "embedded-dma"` names the channel a `mode=dma` Push lowers
# onto (a DMA descriptor enqueue), per the §7.4 table.
#
# Physical memory regions (`tcm_per_core`, `shared_sram`, external SDRAM)
# are STILL not declared (`memory_regions = ["heap"]`): TCM/SRAM placement
# is a compiler-pass (`place_data` lowering / `Event::Alloc` emission)
# concern in `nucleus-compiler`, NOT backend codegen, so it is honest-
# deferred here (TASK-0455.02 finding 2 — the embedded backend's
# `Event::Alloc`/`Event::Free` arm stays a fail-loud reject; the variants
# are kept, not deleted, because the compiler still owns their fate).

schema_version  = 1
name            = "embedded-pattern"
tier            = 3
transport       = "embedded-dma"
notify          = ["event", "poll", "barrier", "blocking"]
supports_async  = true
supports_buffer = true
max_buffer      = 2
worker_classes  = ["default"]
memory_regions  = ["heap"]

# Topology/mediation flags (TASK-0455.09; docs/capabilities-toml.md).
# Tier-3 stub shim, single-worker LIB/BIN emit: no host-mediated star
# topology, no host relay, no per-seq-demux reorder. All three false.
# (When the M10 reference shim adds real cross-MCU DMA + a host-
# mediated transport, revisit alongside `supports_async` etc.)
star_topology_host_mediation = false
host_data_relay              = false
reorderable_push             = false
