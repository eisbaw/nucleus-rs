# openmp-rs backend crate. See PRD §7.1, TASK-0044.01.
#
# Tier-1 CPU backend: workers map to rayon threads, transport is shared
# memory, notify is barrier. supports_async=false, supports_buffer=false.
# Same capability surface as pthreads-sync (the cross-backend differential
# gains a THIRD sync-shared-memory row). Differs only in the runtime
# substrate: rayon::scope (instead of std::thread::spawn).
#
# ## Current status: SINGLE- + MULTI-WORKER LANDED (TASK-0044.01.01 cycle 196)
#
# Crate + capabilities.toml + driver dispatch arm + workspace member
# wired through. `emit()` dispatches on `used_workers.len()`:
#   - `<= 1`: delegates to `backend_common::single_worker_main::render_single_worker_main`
#     + `backend_common::project_skeleton::single_binary::{render_cargo_toml,
#     render_run_sh}` — emitted artefact byte-identical to pthreads-sync /
#     pthreads-async single-worker output by construction.
#   - `>= 2`: renders a `main.rs` whose worker spawn site is a
#     `rayon::scope(|s| s.spawn(move |_| { ... }))` over each non-host
#     worker; per-pair `Slot<T> = Mutex<Option<T>> + Condvar` rendezvous
#     + `Arc<Barrier>` for SyncTag-keyed barriers carry over verbatim
#     from `pthreads-sync/src/multi_worker.rs` (the only substrate
#     difference is the spawn primitive). The emitted Cargo.toml gains
#     `rayon = "1"` in its `[dependencies]` block (the single-worker
#     emit stays byte-identical to pthreads-sync's by passing
#     `extra_dependencies = None`).
#
# `rayon = "1"` is NOT a dependency of THIS crate (the host nucleus
# compiler) — only of the emitted Cargo.toml. This crate writes a string.

[package]
name = "openmp-rs"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "openmp_rs"
path = "src/lib.rs"

[dependencies]
nucleus-compiler = { path = "../../nucleus-compiler" }
# Shared codegen primitives — `EmitError` + the project-skeleton
# (Cargo.toml + run.sh) string templates for single-binary backends
# + the multi-worker event walker (`multi_worker_walker`) + the
# `check_frame` emit templates + `host_election`. Same precedent as
# pthreads-async (cycle 16/17, cycle 37 lift): every tier-1 backend
# depends on backend-common.
backend-common = { path = "../../backend-common" }

[dev-dependencies]
# Shared lower-link-inject pipeline boilerplate (TASK-0237). Same
# precedent as pthreads-async/Cargo.toml: tests/single_worker_emit.rs
# lowers a real example and asserts byte-identical emit against
# pthreads-sync.
test-common = { path = "../../test-common" }
# pthreads-sync is now a TEST-ONLY (oracle) dependency. The shared
# single-worker renderer (`render_single_worker_main`) was relocated to
# `backend_common::single_worker_main` in TASK-0455.11 — the last
# inter-backend PRODUCTION arrow — so the `src/` no longer touches it.
# tests/single_worker_emit.rs + tests/multi_worker_emit.rs still emit
# via `pthreads_sync::emit` as the byte-identical single-worker oracle;
# that oracle wiring stays as a dev-dependency.
pthreads-sync = { path = "../pthreads-sync" }
