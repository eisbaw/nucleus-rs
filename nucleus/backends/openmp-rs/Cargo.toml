# openmp-rs backend crate (SKELETON). See PRD §7.1, TASK-0044.01.
#
# Tier-1 CPU backend: workers map to rayon threads, transport is shared
# memory, notify is barrier. supports_async=false, supports_buffer=false.
# Same capability surface as pthreads-sync (the cross-backend differential
# gains a THIRD sync-shared-memory row). Differs only in the runtime
# substrate: rayon::scope (or par_iter) instead of std::thread::spawn.
#
# ## Current status: SKELETON (TASK-0044.01 cycle 173, 2026-05-26)
#
# Crate + capabilities.toml + driver dispatch arm + workspace member
# wired through. `emit()` returns `EmitError::ContractGap` for ALL inputs
# (single- and multi-worker) until the substantive codegen lands. The
# capability-compat check IS real — schedules that would compile against
# pthreads-sync (sync + shared-memory + barrier/blocking) compat-check
# cleanly against openmp-rs; the subsequent codegen call surfaces the
# skeleton via the typed ContractGap forward-link.
#
# No `rayon` dependency yet — it lands when real codegen does. The
# skeleton compiles with std only.

[package]
name = "openmp-rs"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "openmp_rs"
path = "src/lib.rs"

[dependencies]
nucleus-compiler = { path = "../../nucleus-compiler" }
# Shared codegen primitives. Re-exports `EmitError` so the skeleton can
# return `ContractGap` without depending on pthreads-sync. Same precedent
# as pthreads-async (cycle 16): every tier-1 backend depends on
# backend-common; only the few that share semantic delegation (single-
# worker straight-line emit) depend on pthreads-sync.
backend-common = { path = "../../backend-common" }
