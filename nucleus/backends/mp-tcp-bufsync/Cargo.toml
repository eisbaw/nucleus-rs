# mp-tcp-bufsync backend crate. See PRD §7.1, TASK-0036.
#
# Tier-1 backend: workers are OS PROCESSES, transport is
# std::net::TcpStream over loopback, sync = blocking recv, buffered.
# The SECOND tier-1 backend — its job is to make the project's core
# thesis falsifiable: same (algorithm, schedule) -> bit-identical
# output.bin on TWO independent backends (pthreads-sync is #1).
#
# AlgoIR/LinkedIR/ACFG-free, exactly like pthreads-sync: it consumes
# only the per-worker EventList (nucleus_compiler::event), the
# NameSidecar (nucleus_compiler::sidecar) + the inert IrExpr grammar
# those carry.
#
# Drift control (TASK-0124 carried caveat): expression / index /
# kernel-call / single-worker rendering is NOT re-implemented here —
# it calls pthreads-sync's `pub` shared renderers, so there is ONE
# implementation. Only the multi-PROCESS transport (TCP framing,
# barrier-over-TCP, per-worker binaries, run.sh) is mp-tcp-specific.

[package]
name = "mp-tcp-bufsync"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mp_tcp_bufsync"
path = "src/lib.rs"

[dependencies]
nucleus-compiler = { path = "../../nucleus-compiler" }
# Shared codegen primitives (TASK-0244 cycle 37): RenderCtx, the
# expression/index/kernel-call/loop-bound/type renderers, the
# check_frame emit templates, and the multi-worker event walker.
# This is the single source of truth that prevents renderer drift
# across pthreads-sync / pthreads-async / mp-tcp-bufsync.
backend-common = { path = "../../backend-common" }
# Wire protocol v0 source text, copied verbatim into generated
# projects (single source of truth with the protocol's own tests).
mp-tcp-common = { path = "../../mp-tcp-common" }

[dev-dependencies]
# Shared lower-link-inject pipeline boilerplate (TASK-0237).
test-common = { path = "../../test-common" }
# pthreads-sync is now a TEST-ONLY (oracle) dependency. The shared
# single-worker renderer (`render_single_worker_main_with_kernels_attr`)
# was relocated to `backend_common::single_worker_main` in TASK-0455.11
# — the last inter-backend PRODUCTION arrow — so the `src/` no longer
# touches it. tests/pingpong.rs still emits via `pthreads_sync::emit` as
# the byte-identical single-worker oracle, and several emit tests spell
# `pthreads_sync::NameTables`; that oracle wiring stays as a
# dev-dependency.
pthreads-sync = { path = "../pthreads-sync" }
