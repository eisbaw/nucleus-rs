# Shared test-helper crate (TASK-0237). Houses the lower-link-inject
# pipeline boilerplate that was duplicated across three backend test
# suites (pthreads-sync/tests/multi_worker.rs,
# mp-tcp-bufsync/tests/check_frame_emit.rs,
# pthreads-async/tests/skeleton.rs) before this crate landed. A future
# fourth backend (Wave B-2 of TASK-0228 → pthreads-async multi-worker
# emit-string tests) calls the same helper rather than introducing a
# fourth duplicate.
#
# Why a separate crate (vs. a `compiler` test-utils module): keeps
# compiler's public surface free of test-only types AND avoids
# circular deps (test-common cannot depend on pthreads-sync because
# pthreads-sync dev-deps test-common). test-common returns the raw 5
# reverse-name-table BTreeMaps; each backend test composes its own
# `pthreads_sync::NameTables` from them (5-line local block, identical
# across backends but isolated to call sites).

[package]
name = "test-common"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "test_common"
path = "src/lib.rs"

[dependencies]
# Compiler types + the full lower-link-inject pipeline functions are
# the only dependency. No backend deps — avoids the circular arrow
# (backends dev-dep test-common → test-common deps backend = cycle).
compiler = { path = "../compiler" }
