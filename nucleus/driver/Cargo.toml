# `nucleus` driver binary. See TASK-0020 (the binary previously stubbed
# in `nucleus-compiler/src/main.rs` was promoted to its own crate so
# that backend crates can depend on `nucleus-compiler` without
# creating a circular dependency between `nucleus-compiler` and its
# registered backends).
#
# The crate is bin-only. It registers backends by linking them in as
# dependencies and dispatching by name. Adding a new backend at M3+
# (mp-tcp-bufsync, ...) means adding a `[dependencies]` line here plus
# a `match` arm in main.rs. See PRD §12.2 — adding a backend "means
# adding a crate, its capabilities file, and a workspace member entry
# — three concrete things, no hidden machinery". The driver dispatch
# is the fourth concrete thing; it stays in the binary so plugin
# registration is not a runtime concern.

[package]
name = "nucleus"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nucleus"
path = "src/main.rs"

[dependencies]
nucleus-compiler = { path = "../nucleus-compiler" }
# TASK-0336 cycle 164: driver consumes the canonical host-election
# helper directly (cycles 160 / 162 / 163 wirings previously inlined
# the rule independently — see memory
# feedback-driver-must-mirror-backend-election-exactly).
backend-common = { path = "../backend-common" }
pthreads-sync = { path = "../backends/pthreads-sync" }
mp-tcp-bufsync = { path = "../backends/mp-tcp-bufsync" }
# pthreads-async — third tier-1 backend, skeleton (TASK-0042.01 cycle 16);
# emit() returns ContractGap until TASK-0226 lands ring-buffer codegen.
# The dispatch arm in main.rs surfaces the precise forward-link.
pthreads-async = { path = "../backends/pthreads-async" }
# mp-tcp-event — fourth tier-1 backend, SYNC -> ASYNC upgrade of
# mp-tcp-bufsync (TASK-0042.02 cycle 41 Stages 1+2). Single-worker emit
# delegates to the shared pthreads-sync renderer (byte-identical to the
# three shipped backends on single-worker schedules); multi-worker emit
# (mio reactor + per-(src,dst) ring buffer over TCP loopback) returns
# ContractGap with a precise forward-link until Stage 3 lands.
mp-tcp-event = { path = "../backends/mp-tcp-event" }
# openmp-rs — fifth tier-1 backend, M6 (TASK-0044.01). Same capability
# surface as pthreads-sync (sync + shared-memory + barrier/blocking);
# differs only in runtime substrate (rayon scope instead of std::thread).
# Status as of cycle 191: single-worker arm LANDED (delegates to
# pthreads-sync's render_single_worker_main, byte-identical artefact);
# multi-worker arm returns ContractGap forward-linking TASK-0044.01.01
# (rayon-scope codegen pending).
openmp-rs = { path = "../backends/openmp-rs" }
# mp-tcp-poll — sixth tier-1 backend, M6 (TASK-0044.02). Same capability
# surface as mp-tcp-bufsync (sync + tcp + no buffer); differs only in
# wait primitive (nonblocking-read poll loop instead of blocking recv).
# Status as of cycle 192: single-worker arm LANDED (delegates to
# pthreads-sync's render_single_worker_main_with_kernels_attr +
# backend-common's multi_binary skeleton, byte-identical to
# mp-tcp-bufsync's single-process output); multi-worker arm returns
# ContractGap forward-linking TASK-0044.02.02 (nonblocking-poll codegen
# pending).
mp-tcp-poll = { path = "../backends/mp-tcp-poll" }
# mp-uds-event — seventh tier-1 backend, M6 (TASK-0044.03). Same
# capability surface as mp-tcp-event (async + buffer + event notify);
# differs only in transport (Unix domain sockets instead of TCP
# loopback). Status as of cycle 194: single-worker arm LANDED
# (delegates to pthreads-sync's render_single_worker_main_with_kernels_attr
# + backend-common's multi_binary skeleton, byte-identical to
# mp-tcp-event's single-process output); multi-worker arm returns
# ContractGap forward-linking TASK-0044.03.01 (UDS-reactor codegen
# pending). Inherits the (D)+(B2) compensating-pass tower from
# mp-tcp-event when multi-worker lands.
mp-uds-event = { path = "../backends/mp-uds-event" }
# embedded-pattern — FIRST tier-3 backend, M9 (TASK-0047). Generic
# embedded codegen: emits a compile-only `no_std` LIB lowering the
# single-worker EventList against a `NucleusShim` trait + stub shim.
# Acceptance is `cargo check --target thumbv7em-none-eabihf` (run under
# `nix develop .#embedded` via `just check-embedded`), NOT the tier-1
# runtime differential. Per-MCU shims + Renode runtime are M10/M11.
embedded-pattern = { path = "../backends/embedded-pattern" }
