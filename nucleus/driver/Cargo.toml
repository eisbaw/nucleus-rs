# `nucleus` driver binary. See TASK-0020 (the binary previously stubbed
# in `nucleus-compiler/src/main.rs` was promoted to its own crate so
# that backend crates can depend on `nucleus-compiler` without
# creating a circular dependency between `nucleus-compiler` and its
# registered backends).
#
# The crate is bin-only. It registers backends by linking them in as
# dependencies and dispatching by name. Adding a new backend at M3+
# (mp-tcp-bufsync, ...) means adding a `[dependencies]` line here plus
# a `match` arm in main.rs. See PRD §12.2 — adding a backend "means
# adding a crate, its capabilities file, and a workspace member entry
# — three concrete things, no hidden machinery". The driver dispatch
# is the fourth concrete thing; it stays in the binary so plugin
# registration is not a runtime concern.

[package]
name = "nucleus"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nucleus"
path = "src/main.rs"

[dependencies]
nucleus-compiler = { path = "../nucleus-compiler" }
pthreads-sync = { path = "../backends/pthreads-sync" }
mp-tcp-bufsync = { path = "../backends/mp-tcp-bufsync" }
# pthreads-async — third tier-1 backend, skeleton (TASK-0042.01 cycle 16);
# emit() returns ContractGap until TASK-0226 lands ring-buffer codegen.
# The dispatch arm in main.rs surfaces the precise forward-link.
pthreads-async = { path = "../backends/pthreads-async" }
# mp-tcp-event — fourth tier-1 backend, SYNC -> ASYNC upgrade of
# mp-tcp-bufsync (TASK-0042.02 cycle 41 Stages 1+2). Single-worker emit
# delegates to the shared pthreads-sync renderer (byte-identical to the
# three shipped backends on single-worker schedules); multi-worker emit
# (mio reactor + per-(src,dst) ring buffer over TCP loopback) returns
# ContractGap with a precise forward-link until Stage 3 lands.
mp-tcp-event = { path = "../backends/mp-tcp-event" }
