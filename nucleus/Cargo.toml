# Nucleus v2 Cargo workspace. See nuc-nucleus/PRD.md §12.2.
#
# Workspace members are the registry of which crates exist. There is no
# in-code plugin discovery. Adding a backend at M1+ means adding a crate
# directory plus a sibling capabilities.toml plus a line below.
#
# MSRV is NOT pinned here. The single source of truth is flake.nix
# (PRD §12.1 / §13). See TASK-0001 notes.

[workspace]
resolver = "2"
members = [
    # TASK-0084 cycle 76: renamed from `compiler` to disambiguate from
    # the generic English word "compiler" and from the bin name `nucleus`.
    # The bin name in `driver/Cargo.toml` is intentionally still `nucleus`.
    "nucleus-compiler",
    "driver",
    "e2e",
    "mp-tcp-common",
    # Shared backend codegen crate (TASK-0244 cycle 37): houses the
    # multi-worker event-walker (TASK-0239), the check_frame emit
    # templates (TASK-0222), and the RenderCtx + expression/index/
    # kernel-call/loop-bound/type renderers (TASK-0124 et al.) that
    # every tier-1 backend consumes identically. Parents all three
    # backend crates so none has to depend on any other.
    "backend-common",
    "backends/pthreads-sync",
    "backends/mp-tcp-bufsync",
    # pthreads-async (TASK-0042.01 cycle 16): skeleton only — `emit()`
    # returns `ContractGap` until TASK-0226 lands the ring-buffer +
    # Condvar codegen. The workspace member is registered so the
    # capability-compat check + driver dispatch work end-to-end.
    "backends/pthreads-async",
    # mp-tcp-event (TASK-0042.02 cycle 41 Stages 1+2): the fourth
    # tier-1 backend — SYNC -> ASYNC upgrade of mp-tcp-bufsync (the
    # same kind of upgrade pthreads-async is to pthreads-sync).
    # capabilities: transport=tcp, notify=event, supports_async=true,
    # supports_buffer=true. Single-worker emit delegates to the shared
    # pthreads-sync renderer (byte-identical to the other three tier-1
    # backends on single-worker schedules); multi-worker emit (mio
    # reactor + per-(src,dst) ring buffer over TCP loopback) is Stage 3,
    # returns ContractGap until that lands.
    "backends/mp-tcp-event",
    # openmp-rs (TASK-0044.01): fifth tier-1 backend. Same capability
    # surface as pthreads-sync (sync + shared-memory + barrier/blocking);
    # differs in runtime substrate (rayon scope instead of std::thread).
    # Status as of cycle 191: single-worker arm LANDED (delegates to
    # pthreads-sync's render_single_worker_main, byte-identical artefact
    # on the 16 single-worker [[required]] cells); multi-worker arm
    # returns ContractGap forward-linking TASK-0044.01.01.
    "backends/openmp-rs",
    # mp-tcp-poll (TASK-0044.02): sixth tier-1 backend. Same capability
    # surface as mp-tcp-bufsync (sync + tcp + no buffer); differs in
    # wait primitive (nonblocking-read poll loop instead of blocking
    # recv). Status as of cycle 192: single-worker arm LANDED (delegates
    # to pthreads-sync's render_single_worker_main_with_kernels_attr +
    # backend-common's multi_binary skeleton, byte-identical to
    # mp-tcp-bufsync's single-process output on the 16 single-worker
    # [[required]] cells); multi-worker arm returns ContractGap
    # forward-linking TASK-0044.02.02.
    "backends/mp-tcp-poll",
    # mp-uds-event (TASK-0044.03): seventh tier-1 backend. Same
    # capability surface as mp-tcp-event (async + buffer + event
    # notify); differs in transport (Unix domain sockets instead of
    # TCP loopback). Status as of cycle 194: single-worker arm LANDED
    # (delegates to pthreads-sync's render_single_worker_main_with_kernels_attr
    # + backend-common's multi_binary skeleton, byte-identical to
    # mp-tcp-event's single-process output on the 16 single-worker
    # [[required]] cells); multi-worker arm returns ContractGap
    # forward-linking TASK-0044.03.01. Inherits the (D)+(B2)
    # compensating-pass tower from mp-tcp-event when multi-worker
    # lands; TASK-0337 promotion-trigger guard documented on lib.rs.
    "backends/mp-uds-event",
    # embedded-pattern (TASK-0047, M9): the FIRST tier-3 backend. Generic
    # embedded codegen — emits a compile-only `no_std` LIB lowering the
    # single-worker EventList against a `NucleusShim` trait + do-nothing
    # stub shim. Acceptance is `cargo check --target thumbv7em-none-eabihf`
    # (run under `nix develop .#embedded` via `just check-embedded`), NOT
    # the tier-1 runtime differential matrix — the e2e-matrix.toml backends
    # list deliberately EXCLUDES it (compile-only, not run-and-diff). Per-
    # MCU shims + Renode runtime are M10 (TASK-0048) / M11 (TASK-0049).
    "backends/embedded-pattern",
    # mpi-blocking (TASK-0045, M7): the FIRST tier-2 backend. SPMD
    # codegen — ONE Rust binary that dispatches on MPI_Comm_rank (PRD
    # §7.2), launched via `mpiexec -n N`, output is hosted Rust + rsmpi.
    # Like embedded-pattern, this crate is a NORMAL std crate (it only
    # emits strings); the `mpi` crate dependency lives in the GENERATED
    # project, which builds + runs ONLY under `nix develop .#mpi` and is
    # gated by `just check-mpi` (compile + best-effort localhost mpiexec)
    # — NOT the tier-1 bit-identical e2e RUNTIME matrix (PRD §7.4 tier-2
    # ship bar = COMPILE). Single-worker SPMD arm landed cycle M7-entry;
    # the multi-worker arm (rank-dispatched Send/Recv + MPI_Barrier)
    # returns ContractGap forward-linking TASK-0045.01.
    "backends/mpi-blocking",
    # mpi-nonblocking (TASK-0046, M8): the SECOND tier-2 backend. Same
    # SPMD shape as mpi-blocking but Push lowers to a non-blocking
    # BUFFERED send (MPI_Ibsend, local completion) and Wait to a
    # non-blocking receive (MPI_Imrecv/Irecv) + explicit MPI_Wait, so the
    # async/buffered schedules mpi-blocking capability-REJECTS
    # (05-stencil/distributed{,-2d}, 11-game-of-life/pipelined,
    # 09-producer-consumer/pipelined) compile + run here, deadlock-immune.
    # Normal std crate (emits strings); the
    # `mpi` dep is in the GENERATED project, built + run ONLY under
    # `nix develop .#mpi` via `just check-mpi-nonblocking` — NOT the
    # tier-1 e2e RUNTIME matrix (PRD §7.4 tier-2 ship bar = COMPILE).
    "backends/mpi-nonblocking",
    # Shared test-helper crate (TASK-0237 cycle 24): the parse →
    # lower → link → ACFG → inject → sidecar pipeline boilerplate
    # used by every backend's test suite. dev-dependency only.
    "test-common",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
