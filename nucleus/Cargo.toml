# Nucleus v2 Cargo workspace. See nuc-nucleus/PRD.md §12.2.
#
# Workspace members are the registry of which crates exist. There is no
# in-code plugin discovery. Adding a backend at M1+ means adding a crate
# directory plus a sibling capabilities.toml plus a line below.
#
# MSRV is NOT pinned here. The single source of truth is flake.nix
# (PRD §12.1 / §13). See TASK-0001 notes.

[workspace]
resolver = "2"
members = [
    "compiler",
    "driver",
    "e2e",
    "mp-tcp-common",
    "backends/pthreads-sync",
    "backends/mp-tcp-bufsync",
    # pthreads-async (TASK-0042.01 cycle 16): skeleton only — `emit()`
    # returns `ContractGap` until TASK-0226 lands the ring-buffer +
    # Condvar codegen. The workspace member is registered so the
    # capability-compat check + driver dispatch work end-to-end.
    "backends/pthreads-async",
    # Shared test-helper crate (TASK-0237 cycle 24): the parse →
    # lower → link → ACFG → inject → sidecar pipeline boilerplate
    # used by every backend's test suite. dev-dependency only.
    "test-common",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
