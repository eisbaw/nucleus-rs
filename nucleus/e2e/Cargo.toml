# The end-to-end differential test harness. See PRD §10, §12.3.
#
# Drives the (example × schedule × backend) matrix declared by
# `nuc-nucleus/e2e-matrix.toml`. For each cell it invokes the
# `nucleus` driver, builds the resulting Cargo project, runs the
# generated binary against `input.bin`, and diffs the produced
# `output.bin` against `reference.bin` (PRD §10.1 — bit-identity).
#
# TASK-0023.

[package]
name = "e2e"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nucleus-e2e"
path = "src/main.rs"

# Generative property-based cross-backend differential fuzzer
# (TASK-0453.01, widened by TASK-0455.05 + TASK-0453.01.01). Self-
# contained: synthesises structured single-assignment integer programs
# across five families (1-D pipeline / 2-D stencil / partitioned
# reduction / multi-worker partition / for..until), compiles+runs them
# across each program's tier-1 backend set, and asserts byte-identity
# against each other and an in-process reference. No extra deps (its own
# splitmix64 RNG); lives in the e2e crate to sit next to the curated
# harness. Split into per-concern modules under src/bin/diff_fuzz/ to
# stay under the 1000-LoC mega-file fence (TASK-0455.05).
[[bin]]
name = "diff-fuzz"
path = "src/bin/diff_fuzz/main.rs"

[dependencies]
# Serde derives for the matrix manifest (`e2e-matrix.toml`) and the
# backend `capabilities.toml` files. Pinned to the same versions the
# nucleus-compiler crate uses — keeps cargo's dep resolver from
# pulling in two different versions and bloating build times.
serde = { version = "=1.0.219", default-features = false, features = ["derive", "alloc"] }

# TOML parser for the matrix manifest and capabilities files. Pinned
# to the version compatible with the MSRV declared in flake.nix — see
# `nucleus/nucleus-compiler/Cargo.toml` for the version-rationale
# comment.
toml = { version = "=0.7.8", default-features = false, features = ["parse"] }
