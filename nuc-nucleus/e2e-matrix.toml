# Distributed gaps under the mp-tcp-bufsync backend.
#   - 03-reduction/distributed: cycle-30 audit (TASK-0242) ROUTED THE
#     REAL FAILURE. The prior SKIP citing TASK-0117 + TASK-0172 was
