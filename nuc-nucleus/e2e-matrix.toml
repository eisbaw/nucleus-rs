backend  = "mp-tcp-bufsync"
reason   = "TASK-0175: host-excluding barrier needs worker-to-worker mesh; mp-tcp-bufsync's one-connection-per-(host,worker) topology fails LOUD via EmitError::ContractGap (verbatim message above). NOT TASK-0117 (now closed) and NOT TASK-0172 (now closed); sibling pthreads-sync cell PASSES."
milestone = "M3"

