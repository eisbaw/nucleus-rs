# Cycle-213 PROMOTION: 16-jacobi/distributed × 5 wait_slice backends
# (pthreads-sync / pthreads-async / mp-tcp-event / openmp-rs /
# mp-uds-event) now PASS bit-identical (verified by direct
# emit+build+run+cmp on each). The cumulative-cross-iteration
# `field[t] <-- f(field[t-1], ...)` × partition=rows(y) shape needed
# THREE co-landed compiler fixes (cycle 213):
#   - TASK-0341.02.02.01.02 — transfer_inject hoists the w2w `field`
#     Push/Wait out of the partitioned inner loop to the `for t` body,
#     send-then-recv (equal per-worker exchange counts => no deadlock).
#   - TASK-0341.02.02.01.03 — the cumulative array's w2w + host-gather
#     fan-in is classified COPY (banded slice-paste), NOT accumulate
#     (whole-array wrapping_add would xN-double-count the shared
#     history; the host gather of identical full slices was the
#     operative xN source on the extracted output).
#   - TASK-0341.02.02.01.01 — wait_slice N-D nested-loop dispatch emits
#     the banded write-band slice-paste [(t,full),(y,band),(x,full)].
#
# Pre-cycle-213 history (kept for the diagnosis chain): cycle 208
# surfaced halo_inference (B); cycle 209 lifted to (B'); cycle 211b/212
# proved the rank-3 wait_slice guard was a tripwire, not the operative
# blocker (the WHOLE-ARRAY hoist ran-but-produced xN), forcing the
# banded-copy model above.
#
# The 2 flat-host-relay sync backends (mp-tcp-bufsync / mp-tcp-poll)
# stay [[skip]] below: the hoisted w2w `field` Push still sits inside
# the `for t` Event::Loop body, so the TASK-0330 defensive guard fires
# (the flat host-relay can't handle in-Loop w2w). Their remediation is
# the apply_host_data_relay_inject family (mp-tcp-event sibling), a
# DIFFERENT fix not in this cycle's scope.
#
# - 2 backends (mp-tcp-bufsync / mp-tcp-poll): cycle-209 empirically
#   observed (AT FILING TIME) the TASK-0330 defensive guard fired
#   (w2w Push inside an Event::Loop body). The flat host-relay
#   model in cycle-148 / cycle-195 emits the relay block outside
#   any loop, so an in-Loop w2w Push would over-count or mis-order.
