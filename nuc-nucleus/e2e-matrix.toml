# 08-histogram/textbook: TASK-0430 (X1') — the TEXTBOOK scatter where the
# bin is COMPUTED by a PURE kernel call in INDEX position:
# `histogram[bucket(input[i])] <-- inc(histogram[bucket(input[i])])`.
# Drives prog.textbook.algo.nuc (selected via the schedule's `schedule
# for`, TASK-0049.03; kernels.textbook.rs paired by the variant rule,
# TASK-0049.08). This is the WRITE/index analog of the gather READ
# (TASK-0341.03.01) and the call-wrapped sibling of the bounded scatter
# (TASK-0376): lower_index_expr now admits a PURE kernel call in
# array-subscript position (purity-restricted, subscript-only — a
# loop-bound call is rejected, an effectful callee is rejected), and the
# shared backend `render_int_expr` emits `kernels::bucket(<args>)` as the
# integer index, casting `as usize` in the surrounding subscript exactly
# as the gather arm does. The same-symbol read-modify-write stays an
