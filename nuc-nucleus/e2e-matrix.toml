# Nucleus v2 — end-to-end differential test matrix.
#
# Top-level manifest consumed by the `nucleus-e2e` harness. Declares
# which examples are runnable, which schedules each example *requires*
# at the current milestone, and which (example, schedule, backend)
# triples are known to be unsupported so the harness reports them as
# SKIPPED rather than FAILED.
#
# Rationale for a single top-level manifest rather than per-example
# sidecars: the matrix is small (one screen), and the harness already
# needs to walk every example to discover schedules — keeping the
# manifest co-located keeps reviewing the matrix a single-file
# operation. If the matrix grows past one screen, split into sidecars.
#
# Sources of truth:
# - `examples/NN-name/schedules/*.sched.nuc` is the source-of-truth for
#   which schedule *files* exist.
# - `nucleus/backends/*/capabilities.toml` is the source-of-truth for
#   which backends *exist* and what they support.
# - This file declares which schedule × backend cells are *expected*
#   to pass at the current milestone. The harness reports any cell not
#   in this file as informational only; only cells listed under
#   `[[required]]` count toward the exit status.
#
# PRD refs: §9 (examples), §10 (validation), §12.3 (justfile).
# Task ref: TASK-0023.

# Examples that have an `input.bin`, `reference.bin`, and `kernels.rs`
# and thus can be driven end-to-end. Examples without these (13, 14
# at the time of writing) are not yet in the matrix; adding them
# means landing their reference implementation and fixtures first.
runnable_examples = ["01-elementwise-add", "02-split-add", "03-reduction", "05-stencil", "07-matmul"]

# Backends to evaluate. The harness will read each backend's
# `capabilities.toml` to learn what it supports; this list is just the
# enumeration of which backend crates to consider.
backends = ["pthreads-sync", "mp-tcp-bufsync"]

# Required cells — every entry here MUST pass for `just e2e` to exit 0.
# Status reported as PASS or FAIL. Anything not listed runs as
# informational (status PASS, but absent from the required set).
#
# At M1 the required matrix is the trio that drove TASK-0020 / 0021 /
# 0022.

[[required]]
example  = "01-elementwise-add"
schedule = "naive"
backend  = "pthreads-sync"

[[required]]
example  = "02-split-add"
schedule = "naive"
backend  = "pthreads-sync"

[[required]]
example  = "02-split-add"
schedule = "split"
backend  = "pthreads-sync"

[[required]]
example  = "03-reduction"
schedule = "naive"
backend  = "pthreads-sync"

[[required]]
example  = "05-stencil"
schedule = "naive"
backend  = "pthreads-sync"

[[required]]
example  = "07-matmul"
schedule = "naive"
backend  = "pthreads-sync"

# TASK-0143 (per-tile Push/Wait hoisting) has landed and example 07
# blocked is a single-`host` schedule, so the hoisting is a structural
# no-op here; the cell still pins that block-transform + transfer-
# inject produces a byte-identical pipeline for a stacked
# `block=8` schedule.
[[required]]
example  = "07-matmul"
schedule = "blocked"
backend  = "pthreads-sync"

# TASK-0142 (trailing-remainder tiles) has landed. 05-stencil/blocked
# walks `for y : 1..15` (length 14) with `loop y : block=4` — NOT
# divisible by 4. `apply_block_transforms` now rewrites this into the
# full-tile nest (3 tiles of 4) plus one trailing partial tile (width
# 2) using only static-range Repeat/Sequence nodes. Post-TASK-0124
# the backend consumes the per-worker EventList and emits the TILED
# nest (NOT the untiled source loop the old AlgoIR backend emitted).
# 05-stencil/blocked is runtime-correct vs the schedule-independent
# reference because `blur3` is idempotent (writes
# img_out[y][x] = f(img_in), never reads its own output), so the
# trailing partial tile's recomputation of interior pixels is
# harmless. A non-divisible blocked *accumulator* would need per-tile
# base-offset rebinding — tracked as TASK-0173; no required cell
# exercises it.
[[required]]
example  = "05-stencil"
schedule = "blocked"
backend  = "pthreads-sync"

# ---- mp-tcp-bufsync: the SECOND tier-1 backend (TASK-0036). --------
#
# This is the project's headline: the SAME (algorithm, schedule) must
# produce a BIT-IDENTICAL output.bin under both pthreads-sync (shared
# memory threads) AND mp-tcp-bufsync (OS processes over TCP loopback).
# Each cell below is differentially green ONLY because the matching
# pthreads-sync cell above passes against the SAME hand-written
# reference.bin oracle — the diff is real, not coincidental (the two
# backends share ONE expression/index/call renderer; only the
# transport differs).
#
# 02-split-add/split is the LOAD-BEARING case: host + w0 run as TWO
# separate OS processes, exchanging a/b/c over loopback TCP and
# barriering over a separate control connection. That cross-backend
# multi-process differential is the falsifiability keystone.

# Single-process under mp-tcp (0/1 used workers ⇒ one binary whose
# body is the SHARED single-worker renderer ⇒ byte-identical
# arithmetic to pthreads-sync's single process).
[[required]]
example  = "01-elementwise-add"
schedule = "naive"
backend  = "mp-tcp-bufsync"

[[required]]
example  = "02-split-add"
schedule = "naive"
backend  = "mp-tcp-bufsync"

[[required]]
example  = "03-reduction"
schedule = "naive"
backend  = "mp-tcp-bufsync"

# The load-bearing multi-process differential: host + w0 as two OS
# processes over TCP loopback, byte-identical to the pthreads-sync
# 02-split/split cell and to the reference oracle.
[[required]]
example  = "02-split-add"
schedule = "split"
backend  = "mp-tcp-bufsync"

# The remaining single-`host` examples/schedules. Under mp-tcp these
# are single-process (the shared single-worker renderer ⇒ arithmetic
# byte-identical to pthreads-sync's single process) — verified PASS
# against the same reference.bin oracle as the pthreads-sync cells
# above, so they are differentially green under BOTH backends and
# pinned here to prevent a silent regression of either backend.
# (03-reduction/naive is already pinned in the single-process block
# above; not repeated here.)
[[required]]
example  = "05-stencil"
schedule = "naive"
backend  = "mp-tcp-bufsync"

[[required]]
example  = "05-stencil"
schedule = "blocked"
backend  = "mp-tcp-bufsync"

[[required]]
example  = "07-matmul"
schedule = "naive"
backend  = "mp-tcp-bufsync"

[[required]]
example  = "07-matmul"
schedule = "blocked"
backend  = "mp-tcp-bufsync"

# Cells known to fail at the current milestone. The harness reports
# them as SKIPPED with the cited reason — counted toward the
# "informational" tally only. Once the underlying gap is closed
# (TASK-0117 + TASK-0126 here), the corresponding entry moves to
# `[[required]]` and this skip is deleted.

[[skip]]
example  = "03-reduction"
schedule = "distributed"
backend  = "pthreads-sync"
reason   = "TASK-0117 + TASK-0126: distributed placement + per-tile transfer codegen not yet implemented"

[[skip]]
example  = "05-stencil"
schedule = "distributed"
backend  = "pthreads-sync"
reason   = "TASK-0117 + halo synthesis: distributed placement + halo regions not yet implemented"

# Same two distributed gaps under the second backend. mp-tcp-bufsync
# inherits the IDENTICAL upstream limitations as pthreads-sync (these
# are front-pass / contract gaps, NOT transport-specific):
#   - 03-reduction/distributed: the 5-worker reduction injects a
#     NON-uniform barrier (host joins only some). Event::Sync carries
#     no stable cross-worker identity (TASK-0172), so the pre-order
#     -index recovery cannot byte-identically lower it — the backend
#     fails LOUD (EmitError::ContractGap) rather than emit a wrong
#     barrier graph. This is the fail-loud contract working, not a
#     regression; it is skipped here exactly as for pthreads-sync.
#   - 05-stencil/distributed: requests async + buffer=2 + notify=event,
#     none of which a sync tier-1 backend supports; the capability
#     check rejects it (correct) before codegen.
# Both move to [[required]] for mp-tcp-bufsync only when TASK-0117 /
# TASK-0172 land — same trigger as the pthreads-sync skips above.
[[skip]]
example  = "03-reduction"
schedule = "distributed"
backend  = "mp-tcp-bufsync"
reason   = "TASK-0117 + TASK-0172: distributed placement + non-uniform-barrier identity (fail-loud ContractGap, inherited from the EventList contract; not transport-specific)"

[[skip]]
example  = "05-stencil"
schedule = "distributed"
backend  = "mp-tcp-bufsync"
reason   = "TASK-0117 + halo synthesis: distributed placement + halo regions; also async/buffer=2/notify=event exceed the sync tier-1 capability surface (same as pthreads-sync)"

