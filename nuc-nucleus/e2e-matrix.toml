#
# A single compute worker `w0` produces TWO distinct arrays `p` and `q`
# INSIDE one `for i` loop; the host consumes BOTH after the loop
# (`save_pq`). Both are LOOP OUTPUTS on the SAME (w0 -> host) channel —
# their host-side Push is hoisted out PAST the `for i` Repeat (the
# `splice_pushes_global` cut branch). `p` is produced before `q`, so
# producer-rank order is [p, q]; the worker waits {p, q} (rank-sorted by
# `build_waits_for_op`).
#
# Before TASK-0389.01 the naive `splice_after_repeat` ("insert the Push
# immediately after the Repeat") REVERSED co-hoisted Pushes: the host
# sent {q, p} while the worker waited {p, q}. On the strict-FIFO
# backends (mp-tcp-bufsync / mp-tcp-poll via wire::read_msg_expect) that
# is a fail-LOUD seq/tag mismatch ("receiver expected 2, wire delivered
# 3" — captured pre-fix on mp-tcp-bufsync); masked on the per-seq-demux
# event backends. The fix makes the co-hoisted Push textual (= wire-send)
# order equal producer-rank order (append each new Push after any
# already-spliced Pushes at the same insertion point + feed in
# producer-rank order), so the worker Wait order and host Push order
# coincide by construction for ANY loop-output nesting.
#
# Independent reference (reference/src/main.rs, std-only): p = 2*a,
# q = 3*a, concatenated into reference.bin. Bit-identical across all 7
# tier-1 backends. The 18-multigather/naive single-worker schedule (also
# registered) is the smoke test for the same algorithm.
