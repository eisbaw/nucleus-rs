# TASK-0142 (trailing-remainder tiles) has landed. 05-stencil/blocked
# walks `for y : 1..15` (length 14) with `loop y : block=4` — NOT
# divisible by 4. `apply_block_transforms` rewrites this into the
# full-tile nest (3 tiles of 4) plus one trailing partial tile (width
# 2) using only static-range Repeat/Sequence nodes.
#
# TASK-0180 (per-occurrence strip-mine rebinding) has now landed and
# CHANGED this cell's codegen for the better: the strip-mined inner
# `y` is rebound per-occurrence from `Event::Loop.block_tag` — the
# full nest emits `y -> 1 + y__tile*4 + y` (absolute y in 1..13) and
# the trailing partial tile emits `y -> 1 + 3*4 + y` (the CONSTANT
# `num_full*N` base, absolute y in 13..15). Pre-TASK-0180 the old
# program-global `divisible_inner_block_vars` `counts==1` guard saw
# TWO sibling loops over the reused `y` (full + partial), excluded it,
# and emitted the inner loop over the FULL source range `1..15` inside
# BOTH tile loops — 05/blocked was runtime-correct ONLY because
# `blur3` is idempotent (writes img_out = f(img_in), never reads its
# own output) so the gross over-recomputation was harmless. It is now
# STRUCTURALLY correct (proper absolute indices), no longer reliant on
# idempotence, and still byte-identical to the schedule-independent
# reference (verified 3x). This is exactly TASK-0173's AC#1/AC#2
# (the contract carries N + num_full + a partial marker; pthreads-sync
# rebinds full = LO+tile*N+inner and partial = LO+num_full*N+inner) —
# now implemented and EXERCISED by this cell. TASK-0173's remaining
# AC#3 (a dedicated synthetic non-divisible *accumulator* differential
# test) is forward-carried, not self-checked here.
# Example 06 separable-filter: BOTH naive and blocked are required
# differential cells on BOTH backends. naive and blocked are
# byte-identical to the independent `reference.bin` (a different
# control structure: explicit clamped tap loops vs the program's
# rectangular masked accumulator). blocked is correct here — unlike
# 04-prefix-sum/blocked — precisely because each pass uses a DISTINCT
# tiled loop-variable name (`hy` / `vy`), so each tiled inner loop
# occurs exactly once in the EventList and the backend's
# `divisible_inner_block_vars` count==1 guard is satisfied (the
# absolute-index rebinding IS applied). This cell is the positive
# control for TASK-0180's diagnosis. Single-`host`, so under mp-tcp
# these are single-process (shared single-worker renderer ⇒
# arithmetic byte-identical to pthreads-sync).
[[required]]
