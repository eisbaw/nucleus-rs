#     above), so the upstream front-pass / iteration-partitioning gap
#     is closed. The mp-tcp-bufsync failure mode is a TRANSPORT
#     limitation, not a front-pass one: the `place accumulate on
#     {w0..w3}` partition leaves host OUT of the per-partition barrier
#     (host does load_input, the compute workers join phase-1, host
#     resumes for the tree combine). mp-tcp-bufsync's one-connection-
#     per-(host,worker) topology has no worker-to-worker mesh and
#     thus cannot mediate a host-excluding barrier. Backend fails
#     LOUD via EmitError::ContractGap with the verbatim text:
#       "barrier #1 participants {WorkerId(1), WorkerId(2),
#        WorkerId(3), WorkerId(4)} exclude the host worker;
#        mp-tcp-bufsync's one-connection-per-(host,worker) topology
#        requires host as the barrier hub. A host-excluding barrier
#        needs a worker-to-worker mesh (filed as TASK-0175)."
#     Promotion blocked on TASK-0175 (worker-to-worker mesh
#     transport), NOT TASK-0117/0172. Identical root cause to
#     13-cnn-inference batch_parallel × mp-tcp-bufsync (skip block below).
#   - 05-stencil/distributed: requests async + buffer=2 + notify=event,
#     none of which a sync tier-1 backend supports; the capability
#     check rejects it (correct) before codegen.
[[skip]]
