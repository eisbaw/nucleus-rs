# Nucleus v2 — end-to-end differential test matrix.
#
# Top-level manifest consumed by the `nucleus-e2e` harness. Declares
# which examples are runnable, which schedules each example *requires*
# at the current milestone, and which (example, schedule, backend)
# triples are known to be unsupported so the harness reports them as
# SKIPPED rather than FAILED.
#
# Rationale for a single top-level manifest rather than per-example
# sidecars: the matrix is small (one screen), and the harness already
# needs to walk every example to discover schedules — keeping the
# manifest co-located keeps reviewing the matrix a single-file
# operation. If the matrix grows past one screen, split into sidecars.
#
# Sources of truth:
# - `examples/NN-name/schedules/*.sched.nuc` is the source-of-truth for
#   which schedule *files* exist.
# - `nucleus/backends/*/capabilities.toml` is the source-of-truth for
#   which backends *exist* and what they support.
# - This file declares which schedule × backend cells are *expected*
#   to pass at the current milestone. The harness reports any cell not
#   in this file as informational only; only cells listed under
#   `[[required]]` count toward the exit status.
#
# PRD refs: §9 (examples), §10 (validation), §12.3 (justfile).
# Task ref: TASK-0023, TASK-0167.
#
# --- Per-cell `milestone` key (TASK-0167) ----------------------------
#
# Every `[[required]]` and `[[skip]]` entry carries a `milestone` tag
# ("M1"/"M2"/"M3"). SCHEME (honest, not invented taxonomy): the tag is
# *the PRD §11 milestone whose acceptance gate owns this cell* — i.e.
# the milestone at which the cell first became (or will become) a
# mandatory differential cell:
#   - M1 (PRD §11 "single backend"): pthreads-sync, examples 1–3,
#     `naive` — plus 02-split/`split` (the algorithm/schedule split is
#     load-bearing from day one; the split schedule is the M1-era
#     keystone that drove TASK-0020/0021/0022).
#   - M2 (PRD §11 "static scheduling + Petri net; blocked.sched.nuc
#     lands for examples 5,7; determinism in CI"): pthreads-sync
#     `blocked` cells and the remaining pthreads-sync `naive` cells
#     for examples 5 and 7.
#   - M3 (PRD §11 "second backend; examples 1–6 on (naive ∪ blocked)
#     × (pthreads-sync ∪ mp-tcp-bufsync)"): ALL `mp-tcp-bufsync`
#     cells (the second backend lands at M3), and ALL `04-prefix-sum`
#     / `06-separable-filter` cells (examples 4 and 6 only become
#     required from M3).
#
# The `--milestone M<k>` gate is CUMULATIVE (the sane default for a
# regression gate — an earlier milestone's cells must never be
# dropped): `nucleus-e2e --milestone M3` runs the M1 ∪ M2 ∪ M3
# required set; `--milestone M1` runs only the M1 cells. No
# `--milestone` runs the full matrix (unchanged `just e2e`
# behaviour). The TASK-0163 required-coverage guard is scoped by the
# SAME cumulative predicate, so a typo'd/stale required cell still
# hard-fails inside its milestone tier (it cannot silently vanish
# from a subset run).

# Examples that have an `input.bin`, `reference.bin`, and `kernels.rs`
# and thus can be driven end-to-end. Example 13 joined the matrix at
# TASK-0053 cycle-2 (kernels.rs + reference impl + reference.bin
# landed once TASK-0209 cleared the partial-sub-array codegen
# blocker). Example 14 still pending its own kernels.rs / reference /
# fixture trio.
runnable_examples = ["01-elementwise-add", "02-split-add", "03-reduction", "04-prefix-sum", "05-stencil", "06-separable-filter", "07-matmul", "09-producer-consumer", "11-game-of-life", "13-cnn-inference"]

# Backends to evaluate. The harness will read each backend's
# `capabilities.toml` to learn what it supports; this list is just the
# enumeration of which backend crates to consider.
backends = ["pthreads-sync", "mp-tcp-bufsync", "pthreads-async", "mp-tcp-event"]

# Required cells — every entry here MUST pass for `just e2e` to exit 0.
# Status reported as PASS or FAIL. Anything not listed runs as
# informational (status PASS, but absent from the required set).
#
# At M1 the required matrix is the trio that drove TASK-0020 / 0021 /
# 0022.

[[required]]
example  = "01-elementwise-add"
schedule = "naive"
backend  = "pthreads-sync"
milestone = "M1"

[[required]]
example  = "02-split-add"
schedule = "naive"
backend  = "pthreads-sync"
milestone = "M1"

[[required]]
example  = "02-split-add"
schedule = "split"
backend  = "pthreads-sync"
milestone = "M1"

[[required]]
example  = "03-reduction"
schedule = "naive"
backend  = "pthreads-sync"
milestone = "M1"

