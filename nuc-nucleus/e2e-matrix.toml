# enumeration of which backend crates to consider.
#
# openmp-rs joined the matrix in TASK-0044.01 cycle 191 (single-worker
# codegen). Same SCHEDULE-visible capability surface as pthreads-sync
# (sync + shared-memory + barrier/blocking); single-worker emit is
# byte-identical to pthreads-sync's by construction (shared
# `pthreads_sync::render_single_worker_main` + `backend_common::
# project_skeleton::single_binary`). The multi-worker arm is still
# ContractGap — every multi-worker [[required]] cell on openmp-rs is
# explicitly [[skip]]'d with "multi-worker codegen pending" until the
# rayon-scope follow-up of TASK-0044.01 lands.
#
# mp-tcp-poll joined the matrix in TASK-0044.02 cycle 192 (single-worker
# codegen). Same SCHEDULE-visible capability surface as mp-tcp-bufsync
# (sync + tcp + barrier/blocking/poll); single-worker emit is
# byte-identical to mp-tcp-bufsync's single-process output by construction
# (shared `pthreads_sync::render_single_worker_main_with_kernels_attr` +
# `backend_common::project_skeleton::multi_binary`). The multi-worker
# arm (nonblocking-read poll loop) is still ContractGap — every
# multi-worker [[required]] cell on mp-tcp-poll is explicitly [[skip]]'d
# with "multi-worker codegen pending" until TASK-0044.02.02 lands.
#
# mp-uds-event joined the matrix in TASK-0044.03 cycle 194 (single-worker
# codegen). Same SCHEDULE-visible capability surface as mp-tcp-event
# (async + buffer + event); single-worker emit is byte-identical to
# mp-tcp-event's single-process output by construction (shared
# `pthreads_sync::render_single_worker_main_with_kernels_attr` +
# `backend_common::project_skeleton::multi_binary`). wire.rs CONTENT
# diverges from mp-tcp-event's: mp-uds-event emits an inlined
# UDS-specific WIRE_RUNTIME_SRC (UnixStream API) instead of
# mp_tcp_common::WIRE_RUNTIME_SRC (TcpStream API); single-process bin
# does not `mod wire;` so the divergence is invisible to BIN
# byte-equiv. Multi-worker arm landed cycle 197 (TASK-0044.03.01):
# UDS reactor + per-(DataId, SeqTag) ring buffer + epoll readiness +
# Plan-shaped per-worker codegen; structural twin of mp-tcp-event
# with TCP→UDS transport swap. UNLIKE openmp-rs / mp-tcp-poll, there
# are NO capability-mismatch skips because mp-uds-event's capability
# surface IS async + buffer + event.
backends = ["pthreads-sync", "mp-tcp-bufsync", "pthreads-async", "mp-tcp-event", "openmp-rs", "mp-tcp-poll", "mp-uds-event"]

# Tier-2 (M7) MPI backends (TASK-0444). Kept SEPARATE from `backends`
# above because they require the `.#mpi` dev shell (rsmpi build deps +
# a localhost `mpiexec` launcher) that the default-shell matrix and
# `just ci` deliberately do NOT provide (TASK-0063/0068 tiered-shell
# design). They are NEVER run by bare `just e2e`; they run ONLY under
# the harness `--with-mpi` flag (the `just e2e-mpi` recipe, which enters
# `nix develop .#mpi`), which scopes a run to THIS tier INSTEAD of
# `backends` — mutually exclusive in a single invocation, the focused
# out-of-default-matrix sibling of `renode-multimcu-gate` (the tier-3
# embedded gate). The harness HARD-FAILS if `mpiexec` is absent so the
# tier-2 cells can never silently vanish from coverage (TASK-0163
# discipline on the new axis). The `[[required]]` cells for this tier
# carry `backend = "mpi-blocking"` (M7) or `backend = "mpi-nonblocking"`
# (M8) + their milestone tag and are diffed against the SAME
# `reference.bin` oracle the tier-1 differential uses, so an mpi cell
# passing IS a real apples-to-apples cross-backend check — now COUNTED,
# not just `just check-mpi{,-nonblocking}`'s out-of-band assertion.
#
# mpi-nonblocking (TASK-0445) is the M8 async sibling: same `.#mpi`
# shell, same `run.sh` (`mpiexec -n N`) launch path, but
# `supports_async = true` so it ADMITS the async schedules mpi-blocking
# rejects (worker<->worker halo, host-excluding barrier). Its declared
# cells are exactly the four `just check-mpi-nonblocking` proves
# byte-exact under the DEFAULT eager protocol; the dual forced-rendezvous
# arm stays in `check-mpi-nonblocking` (e2e uses default eager only).
# Adding it brings the COUNTED matrix to 9 of 9 backends (only
# embedded-pattern stays out, by design via renode-multimcu-gate).
mpi_backends = ["mpi-blocking", "mpi-nonblocking"]

