# index-FIRST per collect_dataref_access_expr). They coincided in
# prog.gather.algo.nuc ONLY because col_idx is declared before x. This
# reversed-declaration fixture makes them DIVERGE — host sends
# {val, x, col_idx}, the gather index-first traversal makes the worker
# wait {val, col_idx, x}. WITHOUT the TASK-0389 root fix this cell
# fails LOUD on the strict-FIFO backends (read_msg_expect seq/tag
# mismatch: "receiver expected 4, wire delivered 8"); masked on the
# per-seq-demux event backends. The root fix sorts the worker's
# per-channel Wait sequence into the host's per-channel Push order
# (producer-statement rank), so ANY declaration order is FIFO-correct.
